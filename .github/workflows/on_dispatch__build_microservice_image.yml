name: "5. [on_dispatch] build microservice image"

on:
  workflow_dispatch:
    inputs:
      CUSTOM_TAG:
        description: "Custom Docker image tag(s), 'dev' (default), 'v1' for stg and prod, 'v1,dev' to equalize envs"
        type: string
        required: false
        default: "dev"
      SOURCE_PATH:
        description: "Path to the Dockerfile context (default: jobs/etl_jobs/external/instagram)"
        type: string
        required: false
        default: "jobs/etl_jobs/external/instagram"
      DOCKERFILE:
        description: "Name of the Dockerfile (default: Dockerfile.instagram)"
        type: string
        required: false
        default: "Dockerfile.instagram"
      IMAGE:
        description: "Name of the Docker image (default: etl/instagram)"
        type: string
        required: false
        default: "etl/instagram"


permissions:
  contents: write
  id-token: write

jobs:
  register-microservice-image:
    uses: ./.github/workflows/reusable_build_image.yml
    with:
      GITHUB_ENV_NAME: "dev"
      TARGET_ENV: "dev"
      IS_MANUAL_DISPATCH: true
      CUSTOM_TAG: ${{ inputs.CUSTOM_TAG }}
      SOURCE_PATH: ${{ inputs.SOURCE_PATH }}
      CONTEXT_PATH: ${{ inputs.SOURCE_PATH }}
      DOCKERFILE: ${{ inputs.DOCKERFILE }}
      IMAGE: ${{ inputs.IMAGE }}
    secrets:
      WORKLOAD_IDENTITY_PRD: ${{ secrets.WORKLOAD_IDENTITY_PRD }}
      PASSCULTURE_GITHUB_ACTION_APP_ID: ${{ secrets.PASSCULTURE_GITHUB_ACTION_APP_ID }}
      PASSCULTURE_GITHUB_ACTION_APP_PRIVATE_KEY: ${{ secrets.PASSCULTURE_GITHUB_ACTION_APP_PRIVATE_KEY }}
