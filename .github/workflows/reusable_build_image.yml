name: "Build and register airflow docker image"

run-name: "Build image ${{ inputs.GITHUB_ENV_NAME }}"

on:
  workflow_call:
    inputs:
      GITHUB_ENV_NAME:
        type: string
        required: true
      TARGET_ENV:
        type: string
        required: true
      IS_MANUAL_DISPATCH:
        type: boolean
        required: true
      CUSTOM_TAG:
        type: string
        required: false
        default: ""
      SOURCE_PATH:
        type: string
        required: false
        default: "orchestration/k8s-airflow"
      CONTEXT_PATH:
        type: string
        required: false
        default: "."
      DOCKERFILE:
        type: string
        required: false
        default: "Dockerfile.k8s-worker"
      IMAGE:
        type: string
        required: false
        default: "airflow"

    secrets:
      WORKLOAD_IDENTITY_PRD:
        required: true
      PASSCULTURE_GITHUB_ACTION_APP_ID:
        required: true
      PASSCULTURE_GITHUB_ACTION_APP_PRIVATE_KEY:
        required: true

jobs:
  build-and-push-docker-image:
    name: "Build image job (${{ matrix.registry_base.project }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.GITHUB_ENV_NAME }}
    strategy:
      fail-fast: false
      matrix:
        registry_base:
          - registry: europe-west1-docker.pkg.dev
            project: passculture-infra-prod
            repository: pass-culture-artifact-registry/data-gcp
          # - registry: europe-docker.pkg.dev
          #   project: pc-infra-prd
          #   repository: data
    env:
      CD_SERVICE_ACCOUNT: ${{ vars.AIRFLOW_CD_SERVICE_ACCOUNT }}
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: "Install uv"
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: "Install cosign"
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Authenticate through github app ghactionci
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf
        id: github-token
        with:
          app-id: ${{ secrets.PASSCULTURE_GITHUB_ACTION_APP_ID }}
          private-key: ${{ secrets.PASSCULTURE_GITHUB_ACTION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: passdirector
          permission-contents: read
      - name: "Install passdirector"
        run: |
          uv tool install --from "git+https://x-access-token:${{ steps.github-token.outputs.token }}@github.com/pass-culture/passdirector@v0.7.4" passdirector
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: "Authenticate with Google Cloud"
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: auth
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PRD }}
          service_account: ${{ env.CD_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Docker login
        id: docker-login
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          REGISTRY_HOST: ${{ matrix.registry_base.registry }}
        run: |
          echo "${ACCESS_TOKEN}" | docker login -u oauth2accesstoken --password-stdin "$REGISTRY_HOST"
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v2.2.1
        with:
          driver: docker
      - name: "Get short SHA"
        id: "sha"
        run: echo "short_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: "Set Docker Tags"
        id: docker_tags
        env:
          CUSTOM_TAG: ${{ inputs.CUSTOM_TAG }}
          IS_MANUAL_DISPATCH: ${{ inputs.IS_MANUAL_DISPATCH }}
          SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
          TARGET_ENV: ${{ inputs.TARGET_ENV }}
          IMAGE: ${{ matrix.registry_base.registry }}/${{ matrix.registry_base.project }}/${{ matrix.registry_base.repository }}/${{ inputs.IMAGE }}"
        run: |
          # Always tag with the short SHA
          tags="${IMAGE}:${SHORT_SHA}"

          # Add v1 tag if not manual
          if [ "${IS_MANUAL_DISPATCH}" != "true" ]; then
            tags="${tags}\n${IMAGE}:v1"
          fi

          # Add dev tag if dev environment
          if [ "${TARGET_ENV}" == "dev" ]; then
            tags="${tags}\n${IMAGE}:dev"
          fi

          # Add CUSTOM_TAG safely (user input) - supports comma-separated tags
          if [ -n "$CUSTOM_TAG" ]; then
            IFS=',' read -ra CUSTOM_TAGS <<< "$CUSTOM_TAG"
            for tag in "${CUSTOM_TAGS[@]}"; do
              sanitized_tag=$(printf '%s' "$tag" | tr '/ ' '--' | xargs)
              tags="${tags}\n${IMAGE}:${sanitized_tag}"
            done
          fi

          echo -e "tags<<EOF\n$tags\nEOF" >> "$GITHUB_OUTPUT"
      - name: "Build local Docker image"
        env:
          SOURCE_PATH: ${{ inputs.SOURCE_PATH }}
          DOCKERFILE: ${{ inputs.DOCKERFILE }}
          CONTEXT_PATH: ${{ inputs.CONTEXT_PATH }}
        run: |
          docker build \
          -f "${SOURCE_PATH}/${DOCKERFILE}" \
          -t k8s-worker:latest \
          "${CONTEXT_PATH}"

      - name: "Push image with passdirector"
        env:
          TAGS: ${{ steps.docker_tags.outputs.tags }}
        run: |
          echo "$TAGS" | while read -r full_image_path; do
            if [ -n "$full_image_path" ]; then
              TAG="${full_image_path##*:}"
              image_name="${full_image_path%:*}"

              passdirector docker push \
                --source "k8s-worker:latest" \
                --destination "$image_name" \
                --tag "$TAG" \
                --no-sign
            fi
          done
