# Shared, org-wide security/version floors.
#
# `create_microservice.py` seeds these into every newly scaffolded job's
# [tool.uv] constraint-dependencies, and `sync_constraint_dependencies.py`
# adds any missing ones to existing jobs. Per uv's constraint-dependencies
# semantics, these are pure version floors: they only take effect if the
# package is already part of that project's resolved dependency graph
# (direct or transitive) — they never force an install.
#
# Both scripts are additive-only: a package a job's own pyproject.toml
# already constrains is left untouched, even if its version differs from
# the one below.

# please keep this list sorted in alphabetical order by package name.
constraints:
