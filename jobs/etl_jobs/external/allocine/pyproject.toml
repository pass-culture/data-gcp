[project]
name = "allocine"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "google-cloud-bigquery>=3.0.0",
    "google-cloud-secret-manager>=2.24.0",
    "google-cloud-storage>=2.16.0",
    "httpx>=0.27.0",
    "pyarrow>=21.0.0",
    "typer>=0.24",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
constraint-dependencies = [
    "cryptography >= 48.0.1", # GHSA-537c-gmf6-5ccf,
    "pygments >= 2.20.0", # GHSA-5239-wwwm-4pmq,
    "requests >= 2.33.0", # GHSA-9hjg-9r4m-mvj7, GHSA-gc5v-m9x4-r6x2,
    "idna >= 3.15", # GHSA-65pc-fj4g-8rjx,
    "urllib3 >= 2.7.0", # GHSA-2xpw-w6gg-jr37, GHSA-38jv-5279-wg99, GHSA-48p4-8xcf-vxj5, GHSA-gm62-xv2j-4w53, GHSA-pq67-6m6q-mj2v, GHSA-qccp-gfcp-xxvc, GHSA-mf9v-mfxr-j63j,
    "pyasn1 >= 0.6.4", # GHSA-8ppf-4f7h-5ppj, GHSA-hm4w-wwcw-mr6r, GHSA-m4p7-r5rc-7g4j, GHSA-jr27-m4p2-rc6r,
]
