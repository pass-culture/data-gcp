[project]
name = "encrypted-exports"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.36.2",
    "botocore>=1.36.2",
    "duckdb>=1.1.3",
    "fsspec>=2025.5.0",
    "gcsfs>=2025.5.0.post1",
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-storage>=2.19.0",
    "loguru>=0.7.3",
    "typer>=0.15.1",
]

[tool.uv]
constraint-dependencies = [
    "cryptography >= 48.0.1", # GHSA-537c-gmf6-5ccf,
    "idna >= 3.15", # GHSA-65pc-fj4g-8rjx,
    "urllib3 >= 2.7.0", # GHSA-2xpw-w6gg-jr37, GHSA-38jv-5279-wg99, GHSA-48p4-8xcf-vxj5, GHSA-gm62-xv2j-4w53, GHSA-pq67-6m6q-mj2v, GHSA-qccp-gfcp-xxvc, GHSA-mf9v-mfxr-j63j,
    "pyasn1 >= 0.6.4", # GHSA-8ppf-4f7h-5ppj, GHSA-hm4w-wwcw-mr6r, GHSA-m4p7-r5rc-7g4j, GHSA-jr27-m4p2-rc6r,
]
