[project]
name = "geo-referential"
version = "0.1.0"
description = "Import the French geographic referential (IRIS, communes, EPCI, zonings) into the raw lake"
requires-python = ">=3.13,<3.14"
dependencies = [
    "google-cloud-bigquery>=3.41.0",
    "pandas>=2.3.3",
    "pandas-gbq>=0.26.1",
    "pyarrow>=23.0.1",
    "python-calamine>=0.5.3",
    "requests>=2.33.0",
    "shapely>=2.1.0",
    "typer>=0.25.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff",
]

[tool.ruff]
target-version = 'py313'

lint.select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
constraint-dependencies = [
    "cryptography >= 48.0.1", # GHSA-537c-gmf6-5ccf,
    "idna >= 3.15", # GHSA-65pc-fj4g-8rjx,
    "urllib3 >= 2.7.0", # GHSA-2xpw-w6gg-jr37, GHSA-38jv-5279-wg99, GHSA-48p4-8xcf-vxj5, GHSA-gm62-xv2j-4w53, GHSA-pq67-6m6q-mj2v, GHSA-qccp-gfcp-xxvc, GHSA-mf9v-mfxr-j63j,
    "pyasn1 >= 0.6.4", # GHSA-8ppf-4f7h-5ppj, GHSA-hm4w-wwcw-mr6r, GHSA-m4p7-r5rc-7g4j, GHSA-jr27-m4p2-rc6r,
]
