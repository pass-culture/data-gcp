[project]
name = "gsheet"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "google-auth-oauthlib==1.2.0",
    "google-cloud-bigquery==3.24.0",
    "google-cloud-bigquery-storage==2.25.0",
    "google-cloud-core==2.4.1",
    "google-cloud-secret-manager==2.20.0",
    "google-cloud-storage==2.17.0",
    "gspread==6.0.0",
    "numpy",
    "pandas",
    "pandas-gbq==0.23.1",
    "requests>=2.33.0",
    "typer>=0.24",
    "loguru>=0.7.3",
]

## ruff
# Recommended ruff config for now, to be updated as we go along.
[tool.ruff]
target-version = 'py313'

lint.select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.uv]
constraint-dependencies = [
    "cryptography >= 48.0.1", # GHSA-537c-gmf6-5ccf,
    "setuptools >= 83.0.0", # GHSA-5rjg-fvgr-3xxf, GHSA-h35f-9h28-mq5c,
    "pyasn1 >= 0.6.4", # GHSA-8ppf-4f7h-5ppj, GHSA-hm4w-wwcw-mr6r, GHSA-m4p7-r5rc-7g4j, GHSA-jr27-m4p2-rc6r,
]
