[project]
name = "metabase-governance"
version = "0.1.0"
description = "Metabase governance: archiving cards and managing collection permissions"
requires-python = ">=3.13,<3.14"
dependencies = [
    "google-auth-oauthlib==1.3.0",
    "google-cloud-bigquery==3.40.1",
    "google-cloud-bigquery-storage==2.36.2",
    "google-cloud-core==2.5.0",
    "google-cloud-secret-manager==2.26.0",
    "google-cloud-storage==3.9.0",
    "gspread==6.2.1",
    "numpy==2.4.2",
    "pandas==2.3.3",
    "pandas-gbq==0.34.0",
    "pyyaml==6.0.3",
    "requests>=2.33.0",
    "tqdm",
    "typer==0.24.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.ruff]
target-version = "py313"

lint.select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.uv]
constraint-dependencies = [
    "cryptography >= 48.0.1", # GHSA-537c-gmf6-5ccf,
    "pygments >= 2.20.0", # GHSA-5239-wwwm-4pmq,
    "setuptools >= 83.0.0", # GHSA-5rjg-fvgr-3xxf, GHSA-h35f-9h28-mq5c,
    "idna >= 3.15", # GHSA-65pc-fj4g-8rjx,
    "urllib3 >= 2.7.0", # GHSA-2xpw-w6gg-jr37, GHSA-38jv-5279-wg99, GHSA-48p4-8xcf-vxj5, GHSA-gm62-xv2j-4w53, GHSA-pq67-6m6q-mj2v, GHSA-qccp-gfcp-xxvc, GHSA-mf9v-mfxr-j63j,
    "pyasn1 >= 0.6.4", # GHSA-8ppf-4f7h-5ppj, GHSA-hm4w-wwcw-mr6r, GHSA-m4p7-r5rc-7g4j, GHSA-jr27-m4p2-rc6r,
]
