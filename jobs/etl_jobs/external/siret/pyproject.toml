[project]
name = "siret"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "DateTime==4.3",
    "pandas>=2.0.3",
    "google-auth-oauthlib>=0.4.6",
    "google-cloud-bigquery>=2.3.1",
    "google-cloud-bigquery-storage>=2.4.0",
    "google-cloud-core>=1.6.0",
    "google-cloud-secret-manager>=2.2.0",
    "google-cloud-storage>=1.38.0",
    "pandas-gbq>=0.23.1",
    "requests>=2.33.0",
    "Authlib==0.15.4",
    "fsspec==2021.4.0",
]

[tool.ruff]
target-version = 'py313'

lint.select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.uv]
constraint-dependencies = [
    "cryptography >= 48.0.1", # GHSA-537c-gmf6-5ccf,
    "setuptools >= 83.0.0", # GHSA-5rjg-fvgr-3xxf, GHSA-h35f-9h28-mq5c,
    "idna >= 3.15", # GHSA-65pc-fj4g-8rjx,
    "urllib3 >= 2.7.0", # GHSA-2xpw-w6gg-jr37, GHSA-38jv-5279-wg99, GHSA-48p4-8xcf-vxj5, GHSA-gm62-xv2j-4w53, GHSA-pq67-6m6q-mj2v, GHSA-qccp-gfcp-xxvc, GHSA-mf9v-mfxr-j63j,
    "pyasn1 >= 0.6.4", # GHSA-8ppf-4f7h-5ppj, GHSA-hm4w-wwcw-mr6r, GHSA-m4p7-r5rc-7g4j, GHSA-jr27-m4p2-rc6r,
]
