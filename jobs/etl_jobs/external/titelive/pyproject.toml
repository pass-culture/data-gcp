[project]
name = "titelive"
version = "0.1.0"
description = "Titelive ETL pipeline with multiple execution modes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
    "backoff>=2.2.1",
    "gcloud-aio-storage>=9.6.0",
    "google-cloud-bigquery>=3.0.0",
    "google-cloud-secret-manager>=2.24.0",
    "google-cloud-storage>=2.16.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "pandas-gbq>=0.19.0",
    "pyarrow>=23.0.1",
    "pytest>=8.2.2",
    "requests>=2.33.0",
    "tqdm>=4.67.0",
    "typer>=0.24",
]

[tool.ruff]
target-version = 'py312'

lint.select = [
    "E",      # pycodestyle
    "W",      # pycodestyle
    "F",      # Pyflakes
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "I",      # isort
    "SIM",    # flake8-simplify
    "UP",     # pyupgrade
    "RUF",    # Ruff-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.uv]
constraint-dependencies = [
    "cryptography >= 50.0.0", # GHSA-g6cj-pr64-35w5, GHSA-537c-gmf6-5ccf,
    "pygments >= 2.20.0", # GHSA-5239-wwwm-4pmq,
    "setuptools >= 83.0.0", # GHSA-5rjg-fvgr-3xxf, GHSA-h35f-9h28-mq5c,
    "idna >= 3.15", # GHSA-65pc-fj4g-8rjx,
    "urllib3 >= 2.7.0", # GHSA-2xpw-w6gg-jr37, GHSA-38jv-5279-wg99, GHSA-48p4-8xcf-vxj5, GHSA-gm62-xv2j-4w53, GHSA-pq67-6m6q-mj2v, GHSA-qccp-gfcp-xxvc, GHSA-mf9v-mfxr-j63j,
    "pyasn1 >= 0.6.4", # GHSA-8ppf-4f7h-5ppj, GHSA-hm4w-wwcw-mr6r, GHSA-m4p7-r5rc-7g4j, GHSA-jr27-m4p2-rc6r,
]
