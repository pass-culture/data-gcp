[project]
name = "pass-culture-bigquery-alerts"
version = "0.1.0"
description = "ETL job for BigQuery table freshness alerts"
requires-python = ">=3.9,<3.10"
dependencies = [
    "datetime==4.3",
    "pandas==2.2.2",
    "pandas-gbq==0.23.1",
    "typer==0.12.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
constraint-dependencies = [
    "idna >= 3.15", # GHSA-65pc-fj4g-8rjx
    "pyasn1 >= 0.6.4", # GHSA-8ppf-4f7h-5ppj, GHSA-hm4w-wwcw-mr6r, GHSA-m4p7-r5rc-7g4j, GHSA-jr27-m4p2-rc6r
]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]
