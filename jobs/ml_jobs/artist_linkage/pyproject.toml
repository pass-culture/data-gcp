[project]
name = "artist-linkage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "async-timeout>=4.0.3",
    "gcsfs>=2024.9.0.post1",
    "google-cloud-secret-manager>=2.16.0",
    "google-cloud-storage>=2.16.0",
    "ipykernel>=6.29.4",
    "jellyfish>=1.0.3",
    "lancedb>=0.29.2",
    "loguru>=0.7.2",
    "matplotlib>=3.9.2",
    "mlflow>=3.10.1",
    "mwparserfromhell>=0.7.2",
    "pandas[parquet,performance]>=2.2.3",
    "pydantic-ai>=1.99.0",
    "pytest>=9.0.3",
    "rapidfuzz>=3.9.1",
    "ruff>=0.4.5",
    "scikit-learn>=1.5.0",
    "sentence-transformers>=5.2.1",
    "setuptools >= 83.0.0",
    "stqdm>=0.0.5",
    "streamlit>=1.56.0",
    "tornado >= 6.5.7",
    "typer>=0.12.3",
    "unidecode>=1.3.8",
    "pillow >= 12.3.0" # GHSA-jw5h-h276-9jcc, GHSA-2jxr-v4xp-q87w, GHSA-9m85-6jwx-3479,
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]

## ruff
# Recommended ruff config for now, to be updated as we go along.
[tool.ruff]
target-version = 'py310'

# lint.select = ["E4", "E7", "E9", "F", "I"]
lint.select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle
    "F",      # Pyflakes
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "I",      # isort
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
    "PT",     # flake8-pytest-style
    "RUF",    # Ruff-specific rules
    "FBT001", # flake8-boolean-trap
 ]
lint.ignore = [
    "W505", # doc line too long (handled by pydocstyle)
    "E501", # line too long (handled by pycodestyle)
]

[tool.ruff.lint.pydocstyle]
# Automatically disable rules that are incompatible with Google docstring convention
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
# Pydantic needs to be able to evaluate types at runtime
# see https://pypi.org/project/flake8-type-checking/ for flake8-type-checking documentation
# see https://beta.ruff.rs/docs/settings/#flake8-type-checking-runtime-evaluated-base-classes for ruff documentation

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
constraint-dependencies = [
    "pygments >= 2.20.0", # GHSA-x233-2p5x-gpf5
    "bleach >= 6.4.0", # GHSA-8jxr-4gfq-qg7h, GHSA-q4r7-2j3p-rxmx
    "requests >= 2.33.0", # GHSA-35cv-6p6j-x96x
    "pydantic-settings >= 2.14.2", # GHSA-87rw-pf2v-x3x9
    "jupyterlab >= 4.5.10", # GHSA-37w4-hwhx-4rc4, GHSA-mqcg-5x36-vfcg, GHSA-vp7x-m4p5-jhq3, GHSA-hcgh-g6vc-6fg3
    "msgpack >= 1.2.1", # GHSA-qmhj-6hxf-p4j8
    "soupsieve >= 2.8.4", # GHSA-wf34-78mc-v73j, GHSA-p7q2-5c5x-qfhw
    "python-socketio >= 5.16.2", # GHSA-q9x8-6j69-g388
    "python-engineio >= 4.13.2", # GHSA-5rqg-hfv6-mmr4, GHSA-j37r-j4qc-9xfm
    "mcp >= 1.28.1", # GHSA-qq9j-2wq5-9gf3, GHSA-4cc4-g4x5-r7wf, GHSA-3gqf-j8h7-4q7g
    "mistune >= 3.3.0", # GHSA-8mp2-v27r-99xp, GHSA-8g87-j6q8-g93x, GHSA-58cw-g322-p94v, GHSA-v87v-83h2-53w7
    "nltk >= 3.10.0", # GHSA-cgvg-3q2f-4gxm, GHSA-p9pp-j76j-8x4v, GHSA-5j2p-q7q8-hcc7
    "pyasn1 >= 0.6.4", # GHSA-5q8p-9xrr-4jqm, GHSA-gqpq-g87q-wr6g, GHSA-f39v-xm4p-9hm7
    "mlflow >= 3.12.0", # CVE-2026-0545
    "aiohttp >= 3.14.1", # GHSA-jg22-mg44-37j8, GHSA-hg6j-4rv6-33pg, GHSA-9gh4-3mxq-6h5c
    "authlib >= 1.6.12", # CVE-2026-41425, CVE-2026-44681, CVE-2026-41479
    "cryptography >= 46.0.7", # CVE-2026-39892
    "gitpython >= 3.1.55", # GHSA-rwj8-pgh3-r573, GHSA-hxwm-x553-x359, GHSA-wfm5-v35h-vwf4, GHSA-cjjc-xp8v-855w, GHSA-j4jw-m6xq-5x6x, GHSA-63pj-vm49-gjx3, GHSA-xm45-vr68-g3jr, GHSA-9vhm-6c77-rvj4, GHSA-rpm5-65cw-6hj4
    "idna >= 3.15", # CVE-2026-45409
    "mako >= 1.3.12", # CVE-2026-44307, CVE-2026-41205
    "pillow >= 12.2.0", # CVE-2026-42309, CVE-2026-42311, CVE-2026-42310, CVE-2026-40192, CVE-2026-42308
    "pyarrow >= 23.0.1", # CVE-2026-25087
    "pydantic-ai-slim >= 1.99.0", # CVE-2026-46678
    "pyjwt >= 2.13.0", # CVE-2026-48522, CVE-2026-48524, CVE-2026-48525, CVE-2026-48526
    "python-dotenv >= 1.2.2", # CVE-2026-28684
    "python-multipart >= 0.0.27", # CVE-2026-40347, CVE-2026-42561
