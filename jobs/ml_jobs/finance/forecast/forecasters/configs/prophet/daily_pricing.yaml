prophet:
  growth: logistic
  changepoints: []  # automatic detection (see changepoint_range) - was a hardcoded list ending 2025-06-25
  changepoint_range: 0.9
  changepoint_prior_scale: 0.05
  yearly_seasonality: true
  weekly_seasonality: true
  daily_seasonality: false
  seasonality_mode: multiplicative
  seasonality_prior_scale: 1  # was 5 (leftover from additive tuning) - under multiplicative
  # seasonality, cap/floor only bound the trend, not yhat = trend*(1+seasonal); a loose
  # prior let yearly+weekly+monthly+holiday components stack to a large % and blow past
  # the cap, causing a ~7x monthly overshoot. Needs backtest re-tuning, this is a safer
  # starting point matching weekly_pricing.yaml, not a verified-optimal value.
  interval_width: 0.95
  scaling: absmax
features:
  adding_country_holidays: true
  add_monthly_seasonality: true
  monthly_fourier_order: 5
  pass_culture_seasonality: false
  # total_available_credits: enable once ml_finance__daily_available_credits is
  # deployed, backfilled, and joined into daily_pricing (see docs/changepoints_feature_plan.md)
  regressors: null
  regressor_future_strategy: hold_last_value
data_processing:
  train_prop: 0.8
  table_name: daily_pricing
  date_column_name: pricing_day
  target_name: total_pricing
evaluation:
  cv: true
  cv_initial: 0.6  # 60% of training data for initial window
  cv_period: 0.15  # 15% of training data between cutoffs
  cv_horizon: 0.3  # 30% of training data for forecast horizon
  freq: D
