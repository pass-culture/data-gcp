    "jupyterlab >= 4.5.11", # GHSA-37w4-hwhx-4rc4, GHSA-mqcg-5x36-vfcg, GHSA-vp7x-m4p5-jhq3, GHSA-hcgh-g6vc-6fg3, GHSA-6966-vjj6-99xv
