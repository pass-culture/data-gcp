[project]
name = "DAF_pricing_forecast"
version = "0.1.0"
description = "Forecast pricing values for the Pass Culture Finance team using machine learning models, including Prophet, to support data-driven financial decisions."
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "db-dtypes>=1.5.0",
    "google-cloud-aiplatform>=1.132.0",
    "google-cloud-bigquery>=3.39.0",
    "google-cloud-iam>=2.21.0",
    "google-cloud-storage>=2.19.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "mlflow>=3.8.0",
    "numpy==2.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pandas-gbq>=0.33.0",
    "prophet>=1.2.1",
    "scikit-learn>=1.7.2",
    "tqdm>=4.67.1",
    "typer>=0.21.0",
]
[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.0.3",
    "ruff>=0.14.13",
]

