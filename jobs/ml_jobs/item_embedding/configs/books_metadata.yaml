name: "books_metadata"
features:
  - offer_name
  - offer_description
  - author_concat
  - gtl_concat
encoder_name: "google/embeddinggemma-2"
prompt_name: "Clustering"
preprocessors:
  offer_name: "normalize_whitespace"
  offer_description: "clean_description"
# Literal block (|-) so each line is rendered independently
prompt_template: |-
  Ce livre est intitulé "{offer_name}".
  Écrit par {author_concat}.
  Genres: {gtl_concat}.
  Résumé: {offer_description}.
