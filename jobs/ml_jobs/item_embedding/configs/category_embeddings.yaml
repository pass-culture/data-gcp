# Example config demonstrating category-scoped vectors: each vector below
# only applies to a subset of items (movies, books), uses its own feature
# set, and renders a natural-language prompt_template for extra context
# around the title/description instead of the generic "label : value" dump
# used by default.yaml.
#
# `category_filter` has two composable, ANDed layers:
#   - `all_of`: conditions that must always hold (AND).
#   - `any_of`: groups of conditions; an item matches if it satisfies at
#     least one group (OR across groups), each group's own conditions being
#     ANDed together.
# Each condition matches on a free-form `column` by exactly one of `values`
# (isin) or `prefix` (startswith). This is fully variabilized: add a new
# category by copying one block below.
#
# `preprocessors` maps a feature to a registered function name in
# preprocessing.py. `clean_description` mirrors the BigQuery
# cleaned_offer_description SQL (strips URLs/AlloCiné boilerplate, collapses
# line breaks and spaces). `normalize_whitespace` (used here for offer_name)
# is still a dummy placeholder — real title cleaning logic is to be detailed
# later.
#
# `extra_semantic_metadata` is a single shared JSON column, uniform across
# categories: {"<content_type>": {...category-specific payload...}}, e.g.
# {"movies": {"genres": ["DRAMA", "ACTION"]}} or {"books": {"gtl1": "roman",
# "gtl2": "19eme siecle", "gtl3": "tragedie", "gtl4": null}}. The
# content-type key ("movies"/"books") is fixed in preprocessing.py,
# independent of whatever name a vector is given below, so renaming a
# vector doesn't silently break metadata extraction. A category-specific
# preprocessor (`format_movie_genres` / `format_book_classification`)
# extracts its own entry and turns it into a plain string before it's used
# in `prompt_template`, same as any other feature.

vectors:
  - name: "movies_content"
    category_filter:
      all_of:
        - column: "item_id"
          prefix: "product"
      any_of:
        - conditions:
            - column: "item_id"
              prefix: "product"
            - column: "category_id"
              values: ["CINEMA"]
            - column: "subcategory_id"
              values: ["SEANCE_CINE"]
        - conditions:
            - column: "category_id"
              values: ["CINEMA"]
            - column: "subcategory_id"
              values: ["CINE_PLEIN_AIR","EVENEMENT_CINE","FESTIVAL_CINE"]
        - conditions:
            - column: "category_id"
              values: ["FILM"]
            - column: "subcategory_id"
              values: ["SUPPORT_PHYSIQUE_FILM","VOD","AUTRE_SUPPORT_NUMERIQUE"]
    features:
      - offer_name
      - offer_description
      - extra_semantic_metadata
    encoder_name: "google/embeddinggemma-300m"
    prompt_name: "document"
    preprocessors:
      offer_name: "normalize_whitespace"
      offer_description: "clean_description"
      extra_semantic_metadata: "format_movie_genres"
    prompt_template: >-
      Ce film est intitulé "{offer_name}". Synopsis: {offer_description}.
      Genres: {extra_semantic_metadata}.

  - name: "books_content"
    category_filter:
      all_of:
        - column: "item_id"
          prefix: "product"
        - column: "category_id"
          values: ["LIVRE"]
        - column: "subcategory_id"
          values: ["LIVRE_PAPIER"]
    features:
      - offer_name
      - offer_description
      - author_concat
      - extra_semantic_metadata
    encoder_name: "google/embeddinggemma-300m"
    prompt_name: "document"
    preprocessors:
      offer_name: "normalize_whitespace"
      offer_description: "clean_description"
      # For books, format_book_classification reads the "books" entry of the
      # extra_semantic_metadata envelope, e.g. {"books": {"gtl1": "roman",
      # "gtl2": "19eme siecle", "gtl3": "tragedie", "gtl4": null}} (a generic
      # 4-level GTL taxonomy that may stop at any depth, no fixed per-level
      # meaning). It labels each level by position and joins them with ">"
      # ("niveau 1 : roman > niveau 2 : 19eme siecle > niveau 3 : tragedie"),
      # so the same term at a different depth (e.g. "tragedie" at niveau 2
      # for a play vs. niveau 3 here) isn't collapsed into an ambiguous
      # sequence for the model.
      extra_semantic_metadata: "format_book_classification"
    prompt_template: >-
      Ce livre est intitulé "{offer_name}" par {author_concat}.
      Résumé: {offer_description}.
      Classification: {extra_semantic_metadata}.


  # Add a new category vector by copying a block above and changing:
  # name, category_filter, features, prompt_template, preprocessors.
