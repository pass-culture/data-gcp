name: "movies_metadata"
features:
  - offer_name
  - offer_description
  - allocine_genres_concat
encoder_name: "google/embeddinggemma-300m"
prompt_name: "document"
preprocessors:
  offer_name: "normalize_whitespace"
  offer_description: "clean_description"
# Literal block (|-) so each line is rendered independently
prompt_template: |-
  Ce film est intitulé "{offer_name}".
  Genres: {allocine_genres_concat}.
  Synopsis: {offer_description}.
