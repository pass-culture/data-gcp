[project]
name = "item-embedding"
version = "0.1.0"
description = "Microservice to embed items with sentence transformers models"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "gcsfs>=2026.2.0",
    "google-cloud-secret-manager>=2.26.0",
    "loguru>=0.7.3",
    "numpy>=2.2.6",
    "pandas>=2.2.0,<3.0.0",
    "pyarrow >= 23.0.1",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.0.1",
    "torch >= 2.13.0",
    "typer>=0.9.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "pytest>=8.0.0",
    "ruff>=0.15.4",
]

[tool.uv]
constraint-dependencies = [
    "keras >= 3.14.0", # PYSEC-2026-2324
    "click >= 8.3.3", # PYSEC-2026-2132
    "aiohttp >= 3.14.3", # GHSA-mq44-7p77-q5h7, GHSA-mfx4-hv73-q22v, GHSA-cq5v-8q36-5273
    "cryptography >= 49.0.0", # GHSA-537c-gmf6-5ccf, GHSA-m2h6-j472-rp4c, GHSA-jwv3-5hgf-82ww
]
