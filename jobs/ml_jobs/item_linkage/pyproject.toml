[project]
name = "item-linkage"
version = "0.1.0"
requires-python = ">=3.11, <3.13"
dependencies = [
    "async-timeout>=4.0.3",
    "docarray>=0.21.0",
    "gcsfs>=2023.1.0",
    "google-cloud-bigquery[pandas]>=3.29.0",
    "google-cloud-iam>=2.21.0",
    "hnne>=0.1.10",
    "lancedb>=0.18.0",
    "loguru>=0.6.0",
    "matplotlib>=3.10.5",
    "mlflow>=3.8.1",
    "networkx>=3.3",
    "numpy>=1.26.0",
    "pandas>=2.2.2",
    "pandas-gbq>=0.23.1",
    "polars>=0.18.6",
    "recordlinkage>=0.16",
    "seaborn>=0.13.2",
    "sentence-transformers>=3.3.1",
    "setuptools>=78.1.1",
    "streamlit>=1.35.0",
    "torch >= 2.13.0",
    "tornado>=6.5",
    "tqdm>=4.67.3",
    "typer>=0.7.0",
]
[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
constraint-dependencies = [
    "starlette >= 1.3.1", # GHSA-86qp-5c8j-p5mr, GHSA-wqp7-x3pw-xc5r, GHSA-x746-7m8f-x49c, PYSEC-2026-161
    "keras >= 3.14.0", # PYSEC-2026-2324
    "click >= 8.3.3", # PYSEC-2026-2132
    "aiohttp >= 3.14.3", # GHSA-mq44-7p77-q5h7, GHSA-mfx4-hv73-q22v, GHSA-cq5v-8q36-5273
    "pyarrow >= 23.0.1", # GHSA-rgxp-2hwp-jwgg, PYSEC-2026-113
    "cryptography >= 49.0.0", # GHSA-537c-gmf6-5ccf, GHSA-m2h6-j472-rp4c, GHSA-jwv3-5hgf-82ww
    "mlflow >= 3.12.0", # CVE-2026-0545
]

## ruff
# Recommended ruff config for now, to be updated as we go along.
[tool.ruff]
target-version = 'py311'

lint.select = ["E4", "E7", "E9", "F", "I"]
# TARGET : lint.select = [
#     "E",      # pycodestyle
#     "W",      # pycodestyle
#     "F",      # Pyflakes
#     "B",      # flake8-bugbear
#     "C4",     # flake8-comprehensions
#     "I",      # isort
#     "SIM",    # flake8-simplify
#     "TCH",    # flake8-type-checking
#     "TID",    # flake8-tidy-imports
#     "UP",     # pyupgrade
#     "PT",     # flake8-pytest-style
#     "RUF",    # Ruff-specific rules
#     "FBT001", # flake8-boolean-trap
# ]

[tool.ruff.lint.pydocstyle]
# Automatically disable rules that are incompatible with Google docstring convention
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
# Pydantic needs to be able to evaluate types at runtime
# see https://pypi.org/project/flake8-type-checking/ for flake8-type-checking documentation
# see https://beta.ruff.rs/docs/settings/#flake8-type-checking-runtime-evaluated-base-classes for ruff documentation
