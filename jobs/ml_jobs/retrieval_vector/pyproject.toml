[project]
name = "retrieval-vector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    "hnne>=0.1.10",
    "hypercorn>=0.15.0",
    "lancedb>=0.29.2",
    "loguru>=0.6.0",
    "numpy>=1.26.4",
    "pandas>=2.1.1",
    "polars>=1.35.2",
    "pylance>=0.23.2",  # Lance columnar format library (not the VS Code language server)
    "pyarrow >= 23.0.1",
    "python-json-logger>=2.0.7",
    "tf-keras>=2.20.1",
    "torch >= 2.13.0",
    "torchvision>=0.21.0",
]


[dependency-groups]
dev = [
    "flask-testing>=0.8.1",
    "gcsfs>=2023.5.0",
    "google-cloud-aiplatform>=1.133.0",
    "google-cloud-bigquery[pandas]>=3.25.0",
    "google-cloud-secret-manager>=2.4.0",
    "keras >= 3.14.0",
    "mlflow>=3.8.1",
    "numpy>=1.26.4",
    "polars>=0.18.6",
    "protobuf>=3.9.2",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.6.1",
    "tensorflow>=2.15.1",
    "torch>=2.6.0",
    "tqdm>=4.64.1",
    "typer>=0.7.0",
    "unittest2>=1.1.0",
]

## uv
[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
constraint-dependencies = [
    # cryptography skipped: mlflow>=3.12.0 hard-requires cryptography<50, incompatible with >=50.0.0 (GHSA-g6cj-pr64-35w5, PYSEC-2026-3552)
    "urllib3 >= 2.7.0", # GHSA-qccp-gfcp-xxvc, GHSA-mf9v-mfxr-j63j
    "setuptools >= 83.0.0", # GHSA-6j4f-hj78-v4c9
    "pygments >= 2.20.0", # GHSA-x233-2p5x-gpf5
    "bleach >= 6.4.0", # GHSA-8jxr-4gfq-qg7h, GHSA-q4r7-2j3p-rxmx
    "python-dotenv >= 1.2.2", # GHSA-mf9w-mj56-hr94
    "requests >= 2.33.0", # GHSA-35cv-6p6j-x96x
    "pydantic-settings >= 2.14.2", # GHSA-87rw-pf2v-x3x9
    "idna >= 3.15", # GHSA-65pc-fj4g-8rjx
    "aiohttp >= 3.14.3", # GHSA-mq44-7p77-q5h7, GHSA-mfx4-hv73-q22v, GHSA-cq5v-8q36-5273
    "jupyterlab >= 4.5.10", # GHSA-37w4-hwhx-4rc4, GHSA-mqcg-5x36-vfcg, GHSA-vp7x-m4p5-jhq3, GHSA-hcgh-g6vc-6fg3
    "tornado >= 6.5.7", # GHSA-4gh8-x3vv-phhg, GHSA-qrcp-jww8-49hg, GHSA-xf96-mx7x-9q66
    "msgpack >= 1.2.1", # GHSA-qmhj-6hxf-p4j8
    "soupsieve >= 2.8.4", # GHSA-wf34-78mc-v73j, GHSA-p7q2-5c5x-qfhw
    "python-socketio >= 5.16.2", # GHSA-q9x8-6j69-g388
    "python-engineio >= 4.13.2", # GHSA-5rqg-hfv6-mmr4, GHSA-j37r-j4qc-9xfm
    "mcp >= 1.28.1", # GHSA-qq9j-2wq5-9gf3, GHSA-4cc4-g4x5-r7wf, GHSA-3gqf-j8h7-4q7g
    "mako >= 1.3.12", # GHSA-2h4p-vjrc-8xpq, GHSA-x3qc-7vxr-3493
    "mistune >= 3.3.0", # GHSA-8mp2-v27r-99xp, GHSA-8g87-j6q8-g93x, GHSA-58cw-g322-p94v, GHSA-v87v-83h2-53w7
    "nltk >= 3.10.0", # GHSA-cgvg-3q2f-4gxm, GHSA-p9pp-j76j-8x4v, GHSA-5j2p-q7q8-hcc7
    "pillow >= 12.3.0", # GHSA-jw5h-h276-9jcc, GHSA-2jxr-v4xp-q87w, GHSA-9m85-6jwx-3479
    "pyasn1 >= 0.6.4", # GHSA-5q8p-9xrr-4jqm, GHSA-gqpq-g87q-wr6g, GHSA-f39v-xm4p-9hm7
    "gitpython >= 3.1.58", # GHSA-4gmw-gg2m-w46p, GHSA-9rj7-rf2p-w77r, GHSA-hh9p-6wh2-4mfc, GHSA-jm78-9fvv-mhgr, GHSA-wvpp-8hx9-p66j
    "sqlparse >= 0.6.0", # GHSA-3496-9g83-7v6x, GHSA-f2ff-p2ww-7p4p, GHSA-prg7-hcfm-mfcr, GHSA-pwgv-4x5q-6m9f
    "h2 >= 4.4.1", # GHSA-6hr6-w5qg-qmwg, PYSEC-2026-3628
    "starlette >= 1.3.1", # GHSA-86qp-5c8j-p5mr, GHSA-wqp7-x3pw-xc5r, GHSA-x746-7m8f-x49c, PYSEC-2026-161
    "click >= 8.3.3", # PYSEC-2026-2132
    "mlflow >= 3.15.0", # CVE-2026-0545, CVE-2026-64849 (GHSA-7gwp-5pfp-969j)
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]
torchvision = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

## ruff
# Recommended ruff config for now, to be updated as we go along.
[tool.ruff]
target-version = 'py310'

lint.select = ["E4", "E7", "E9", "F", "I"]
# TARGET : lint.select = [
#     "E",      # pycodestyle
#     "W",      # pycodestyle
#     "F",      # Pyflakes
#     "B",      # flake8-bugbear
#     "C4",     # flake8-comprehensions
#     "I",      # isort
#     "SIM",    # flake8-simplify
#     "TCH",    # flake8-type-checking
#     "TID",    # flake8-tidy-imports
#     "UP",     # pyupgrade
#     "PT",     # flake8-pytest-style
#     "RUF",    # Ruff-specific rules
#     "FBT001", # flake8-boolean-trap
# ]

[tool.ruff.lint.pydocstyle]
# Automatically disable rules that are incompatible with Google docstring convention
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

# Pydantic needs to be able to evaluate types at runtime
# see https://pypi.org/project/flake8-type-checking/ for flake8-type-checking documentation
# see https://beta.ruff.rs/docs/settings/#flake8-type-checking-runtime-evaluated-base-classes for ruff documentation
