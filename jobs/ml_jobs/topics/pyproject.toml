[project]
name = "topics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "142802218+vbusson-pass@users.noreply.github.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "gcsfs>=2026.10.1",
    "google-auth>=2.62.1",
    "google-cloud-bigquery>=3.47.0",
    "google-cloud-iam>=2.27.0",
    "google-cloud-storage>=3.17.1",
    "loguru>=0.7.2",
    "mlflow>=3.18.0",
    "numpy>=2.5.4",
    "pandas>=2.1.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "ruff>=0.4.5",
    "typer>=0.24.0",
]

[project.optional-dependencies]
vocabulary = [
    "fr-core-news-sm",
    "py3langid>=0.4.0",
    "spacy~=3.8",
]
# Declared empty (not yet implemented) so the planned domain split is
# documented up front; filled in when each domain is built.
reduction = [
    "umap-learn>=0.6.0",
]
clustering = [
    "hdbscan>=0.8.44",
]
labelling = [
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]
gpu = [
    "cuml-cu13>=26.10.0 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
]

[tool.uv]
package = false
constraint-dependencies = [
    "aiohttp>=3.14.3", # GHSA-cq5v-8q36-5273, and related aiohttp advisories
    "anyio>=4.14.2", # GHSA-82r6-8w77-94w6, GHSA-5p39-cfhj-2xmp
    "apache-airflow-providers-google>=22.3.0", # apache-airflow-providers-google security advisories
    "authlib>=1.6.12", # CVE-2026-41425, CVE-2026-44681, CVE-2026-41479
    "bleach>=6.4.0", # GHSA-8jxr-4gfq-qg7h, GHSA-q4r7-2j3p-rxmx
    "certifi>=2026.10.18", # certifi security advisory
    "click>=8.3.3", # PYSEC-2026-2132
    "cryptography>=49.0.0", # cryptography security advisories
    "gitpython>=3.1.60", # GHSA-4gmw-gg2m-w46p, GHSA-9rj7-rf2p-w77r, GHSA-hh9p-6wh2-4mfc, GHSA-jm78-9fvv-mhgr, GHSA-wvpp-8hx9-p66j, PYSEC-2026-3982, PYSEC-2026-3983, PYSEC-2026-3984
    "httpcore2>=2.10.0", # GHSA-7mj9-2mp8-4m2p, PYSEC-2026-3844
    "httpx2>=2.12.0", # GHSA-h4x7-gw46-3wm6, GHSA-pf96-p4fj-6566, GHSA-8xx6-hgc6-gc2m, PYSEC-2026-3849, PYSEC-2026-3848, PYSEC-2026-3846
    "idna>=3.15", # CVE-2026-45409
    "jupyterlab>=4.5.10", # GHSA-37w4-hwhx-4rc4, GHSA-mqcg-5x36-vfcg, GHSA-vp7x-m4p5-jhq3, GHSA-hcgh-g6vc-6fg3
    "keras>=3.14.0", # PYSEC-2026-2324
    "mako>=1.3.12", # CVE-2026-44307, CVE-2026-41205
    "mcp>=1.28.1", # GHSA-qq9j-2wq5-9gf3, GHSA-4cc4-g4x5-r7wf, GHSA-3gqf-j8h7-4q7g
    "mistune>=3.3.0", # GHSA-8mp2-v27r-99xp, GHSA-8g87-j6q8-g93x, GHSA-58cw-g322-p94v, GHSA-v87v-83h2-53w7
    "mlflow>=3.15.0", # CVE-2026-0545, CVE-2026-64849 (GHSA-7gwp-5pfp-969j)
    "msgpack>=1.2.1", # GHSA-qmhj-6hxf-p4j8
    "nltk>=3.10.0", # GHSA-cgvg-3q2f-4gxm, GHSA-p9pp-j76j-8x4v, GHSA-5j2p-q7q8-hcc7
    "pillow>=12.2.0", # CVE-2026-42309, CVE-2026-42311, CVE-2026-42310, CVE-2026-40192, CVE-2026-42308
    "pyarrow>=23.0.1", # CVE-2026-25087
    "pyasn1>=0.6.4", # GHSA-5q8p-9xrr-4jqm, GHSA-gqpq-g87q-wr6g, GHSA-f39v-xm4p-9hm7
    "pydantic-ai-slim>=1.99.0", # CVE-2026-46678
    "pydantic-settings>=2.14.2", # GHSA-87rw-pf2v-x3x9
    "pygments>=2.20.0", # GHSA-x233-2p5x-gpf5
    "pyjwt>=2.13.0", # CVE-2026-48522, CVE-2026-48524, CVE-2026-48525, CVE-2026-48526
    "pymdown-extensions>=11.0.0", # pymdown-extensions security advisories
    "python-dotenv>=1.2.2", # CVE-2026-28684
    "python-engineio>=4.13.2", # GHSA-5rqg-hfv6-mmr4, GHSA-j37r-j4qc-9xfm
    "python-multipart>=0.0.27", # CVE-2026-40347, CVE-2026-42561
    "python-socketio>=5.16.2", # GHSA-q9x8-6j69-g388
    "requests>=2.33.0", # GHSA-35cv-6p6j-x96x
    "soupsieve>=2.8.4", # GHSA-wf34-78mc-v73j, GHSA-p7q2-5c5x-qfhw
    "sqlparse>=0.6.0", # GHSA-3496-9g83-7v6x, GHSA-f2ff-p2ww-7p4p, GHSA-prg7-hcfm-mfcr, GHSA-pwgv-4x5q-6m9f
    "starlette>=1.0.1", # CVE-2026-48710
    "torch>=2.13.0", # GHSA-rrmf-rvhw-rf47, PYSEC-2026-139
    "tornado>=6.5.8", # tornado security advisories
    "transformers>=5.0.0rc3", # CVE-2026-1839
    "urllib3>=2.7.0", # CVE-2026-44432, CVE-2026-44431
]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[tool.uv.sources]
fr-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl" }

[tool.ruff]
target-version = 'py313'

lint.select = [
    "E",      # pycodestyle
    "W",      # pycodestyle
    "F",      # Pyflakes
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "I",      # isort
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
    "PT",     # flake8-pytest-style
    "RUF",    # Ruff-specific rules
    "FBT001", # flake8-boolean-trap
]

[tool.ruff.lint.pydocstyle]
# Automatically disable rules that are incompatible with Google docstring convention
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
# Pydantic needs to be able to evaluate types at runtime
# see https://pypi.org/project/flake8-type-checking/ for flake8-type-checking documentation
# see https://beta.ruff.rs/docs/settings/#flake8-type-checking-runtime-evaluated-base-classes for ruff documentation
