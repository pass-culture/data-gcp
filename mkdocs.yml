# Project information
site_name: Pass Culture Data Documentation
site_url: https://pass-culture.github.io/data-gcp
site_author: Pass Culture Team
site_description: Documentation for Pass Culture's data repository, providing insights and resources for cultural accessibility projects.

# Repository
repo_name: pass-culture/data-gcp
repo_url: https://github.com/pass-culture/data-gcp

# Copyright
copyright: Copyright &copy; 2024 Pass Culture

hooks:
  - docs/hooks.py
theme:
  name: material
  custom_dir: docs/assets/material/overrides
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme:
      primary: white
      accent: purple
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme:
      primary: black
      accent: purple
      toggle:
        icon: material/toggle-switch-off
        name: Switch to light mode
  font:
    text: "Arial, sans-serif"
    code: Roboto Mono
  favicon: assets/favicon.png
  logo: https://upload.wikimedia.org/wikipedia/commons/4/4f/Logo_du_Pass_Culture.png


nav:
  - Home: index.md
  - Platform:
    - Repository structure: project_structure_and_data_flow.md
    - Data flow: |
    - CI / CD: |
    - Infra: |
  - Data Models:
      - Overview: dbt/overview.md
      - KPIs:
        - Vidoc:
          - dbt/vidoc_kpis/index.md
          - Ever-credited beneficiaries: dbt/vidoc_kpis/ever_credited_beneficiaries.md
          - Active beneficiaries: dbt/vidoc_kpis/active_beneficiaries.md
          - Beneficiary coverage rate: dbt/vidoc_kpis/beneficiary_coverage_rate.md
          - Diversity rate (3+ categories): dbt/vidoc_kpis/diversity_3plus_categories.md
          - Booking share by category: dbt/vidoc_kpis/booking_share_by_category.md
          - Student EAC participation rate: dbt/vidoc_kpis/student_eac_participation_rate.md
          - Institution EAC participation rate: dbt/vidoc_kpis/institution_eac_participation_rate.md
          - EAC credit consumption rate: dbt/vidoc_kpis/eac_credit_consumption_rate.md
          - EAC collective bookings: dbt/vidoc_kpis/eac_collective_bookings.md
          - EAC bookings by educational domain: dbt/vidoc_kpis/eac_bookings_by_domain.md
          - EAC bookings by offer format: dbt/vidoc_kpis/eac_bookings_by_format.md
          - EAC bookable collective offers: dbt/vidoc_kpis/eac_bookable_offers.md
          - Active cultural partners by channel: dbt/vidoc_kpis/active_cultural_partners.md
          - Activated cultural partners: dbt/vidoc_kpis/activated_cultural_partners.md
          - Cultural partners by type: dbt/vidoc_kpis/active_cultural_partners_by_type.md
          - Diversity depth (1+ to 5+): dbt/vidoc_kpis/diversity_category_depth.md
          - Amount granted, spent and spending rate: dbt/vidoc_kpis/credit_amount_at_expiration.md
          - Share of credit spent: dbt/vidoc_kpis/credit_spent_share_distribution.md
          - Distinct venues booked: dbt/vidoc_kpis/distinct_venues_booked.md
        - Ministry exports:
          - dbt/ministry_kpis/index.md
          - User and deposits: dbt/ministry_kpis/user_and_deposit.md
          - Bookings: dbt/ministry_kpis/booking.md
          - Offers and stocks: dbt/ministry_kpis/offer_and_stock.md
          - Offerers and venues: dbt/ministry_kpis/offerer_and_venue.md
          - Geography tables: dbt/ministry_kpis/geography.md
      - Table definitions:
        - ... | dbt/models/**/description*.md
      - Methodology:
        - Statistical confidentiality: dbt/references/statistical_confidentiality.md
  - Glossary:
      - Overview: dbt/glossary.md
      - ... | dbt/glossary/*/column*.md
  - Data Science:
      - Overview: team/ds/overview.md
      - Recommendation: team/ds/recommendation.md
  - Data Engineering:
      - Overview: team/de/overview.md
      - Data Stack: team/de/data_stack.md
      - APIs & Connections: team/de/apis.md

  - About: about.md

# Plugins
plugins:
  - search:
      separator: "[\\s\\-.,;:_]+"
      lang: fr
  - include-markdown
  - awesome-pages
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >-
        Documentation for Pass Culture's data repository: dbt data models,
        KPIs, glossary, and data engineering/science references.
      sections:
        Platform:
          - project_structure_and_data_flow.md
        Data Models:
          - dbt/overview.md
          - dbt/vidoc_kpis/*.md
          - dbt/ministry_kpis/*.md
          - dbt/models/**/description*.md
        Glossary:
          - dbt/glossary.md
          - dbt/glossary/*/column*.md
        Teams:
          - team/ds/*.md
          - team/de/*.md

# Markdown Extensions
markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - meta
  - attr_list
  - tables
  - pymdownx.emoji
  - pymdownx.details
  - pymdownx.superfences
