# Project information
site_name: Pass Culture Data Documentation
site_url: https://pass-culture.github.io/data-gcp
site_author: Pass Culture Team
site_description: Documentation for Pass Culture's data repository, providing insights and resources for cultural accessibility projects.

# Repository
repo_name: pass-culture/data-gcp
repo_url: https://github.com/pass-culture/data-gcp

# Copyright
copyright: Copyright &copy; 2024 Pass Culture

hooks:
  - docs/hooks.py
theme:
  name: material
  custom_dir: docs/assets/material/overrides
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme:
      primary: white
      accent: purple
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme:
      primary: black
      accent: purple
      toggle:
        icon: material/toggle-switch-off
        name: Switch to light mode
  font:
    text: "Arial, sans-serif"
    code: Roboto Mono
  favicon: assets/favicon.png
  logo: https://upload.wikimedia.org/wikipedia/commons/4/4f/Logo_du_Pass_Culture.png


nav:
  - Home: index.md
  - Platform:
    - Repository structure: project_structure_and_data_flow.md
    - Data flow: |
    - CI / CD: |
    - Infra: |
  - Data Models:
      - Overview: dbt/overview.md
      - KPIs:
        - dbt/kpis/index.md
        - Beneficiaries:
          - dbt/kpis/beneficiaries/index.md
          - Ever-credited beneficiaries: dbt/kpis/beneficiaries/ever_credited_beneficiaries.md
          - Active beneficiaries: dbt/kpis/beneficiaries/active_beneficiaries.md
          - Beneficiary coverage rate: dbt/kpis/beneficiaries/beneficiary_coverage_rate.md
        - Diversity:
          - dbt/kpis/diversity/index.md
          - Diversity rate (3+ categories): dbt/kpis/diversity/diversity_3plus_categories.md
          - Diversity depth (1+ to 5+): dbt/kpis/diversity/diversity_category_depth.md
          - Booking share by category: dbt/kpis/diversity/booking_share_by_category.md
          - Distinct venues booked: dbt/kpis/diversity/distinct_venues_booked.md
        - Usage:
          - dbt/kpis/usage/index.md
          - Amount granted, spent and spending rate: dbt/kpis/usage/credit_amount_at_expiration.md
          - Share of credit spent: dbt/kpis/usage/credit_spent_share_distribution.md
          - Bookings by category and beneficiary territory: dbt/kpis/usage/individual_bookings_beneficiary_territory.md
        - Cultural partners:
          - dbt/kpis/partners/index.md
          - Active cultural partners by channel: dbt/kpis/partners/active_cultural_partners.md
          - Activated cultural partners: dbt/kpis/partners/activated_cultural_partners.md
          - Cultural partners by type: dbt/kpis/partners/active_cultural_partners_by_type.md
          - Bookings and tickets by venue territory: dbt/kpis/partners/individual_bookings_venue_territory.md
          - Booking revenue by venue territory: dbt/kpis/partners/individual_revenue_venue_territory.md
        - Collective (EAC):
          - dbt/kpis/collective/index.md
          - Student EAC participation rate: dbt/kpis/collective/student_eac_participation_rate.md
          - Institution EAC participation rate: dbt/kpis/collective/institution_eac_participation_rate.md
          - EAC credit consumption rate: dbt/kpis/collective/eac_credit_consumption_rate.md
          - EAC collective bookings: dbt/kpis/collective/eac_collective_bookings.md
          - EAC bookings by educational domain: dbt/kpis/collective/eac_bookings_by_domain.md
          - EAC bookings by offer format: dbt/kpis/collective/eac_bookings_by_format.md
          - EAC bookable collective offers: dbt/kpis/collective/eac_bookable_offers.md
        - Tops:
          - dbt/kpis/tops/index.md
          - Top offers: dbt/kpis/tops/top_offer_ranking.md
          - Top offers by category: dbt/kpis/tops/top_offer_category_ranking.md
          - Top offers in labelled venues: dbt/kpis/tops/top_offer_labelled_ranking.md
          - Top venues: dbt/kpis/tops/top_venue_ranking.md
          - Top labelled venues: dbt/kpis/tops/top_venue_labelled_ranking.md
      - Exports:
        - data.gouv.fr:
          - dbt/data_gouv/index.md
          - beneficiary: dbt/models/export/data_gouv/description__exp_data_gouv__beneficiary.md
          - beneficiary_coverage: dbt/models/export/data_gouv/description__exp_data_gouv__beneficiary_coverage.md
          - diversity: dbt/models/export/data_gouv/description__exp_data_gouv__diversity.md
          - diversity_by_category: dbt/models/export/data_gouv/description__exp_data_gouv__diversity_by_category.md
        - VIDOC:
          - dbt/vidoc/index.md
          - beneficiary: dbt/models/export/vidoc/description__exp_vidoc_beneficiary.md
          - beneficiary_coverage: dbt/models/export/vidoc/description__exp_vidoc_beneficiary__coverage.md
          - population_coverage: dbt/models/export/vidoc/description__exp_vidoc_population__coverage.md
          - diversity: dbt/models/export/vidoc/description__exp_vidoc_diversity.md
          - diversity_by_category: dbt/models/export/vidoc/description__exp_vidoc_diversity__by_category.md
          - booking_beneficiary: dbt/models/export/vidoc/description__exp_vidoc_booking_beneficiary.md
          - cultural_partner: dbt/models/export/vidoc/description__exp_vidoc_cultural_partner.md
          - cultural_partner_by_type: dbt/models/export/vidoc/description__exp_vidoc_cultural_partner__by_type.md
          - booking_partner_finance_individual: dbt/models/export/vidoc/description__exp_vidoc_booking_partner_finance__individual.md
          - student_coverage: dbt/models/export/vidoc/description__exp_vidoc_student__coverage.md
          - institution_activity: dbt/models/export/vidoc/description__exp_vidoc_institution__activity.md
          - booking_collective: dbt/models/export/vidoc/description__exp_vidoc_booking_collective.md
          - booking_collective_venue: dbt/models/export/vidoc/description__exp_vidoc_booking_collective_venue.md
          - booking_collective_by_domain: dbt/models/export/vidoc/description__exp_vidoc_booking_collective_by_domain.md
          - booking_collective_by_format: dbt/models/export/vidoc/description__exp_vidoc_booking_collective_by_format.md
          - offer_collective_bookable: dbt/models/export/vidoc/description__exp_vidoc_offer_collective_bookable.md
          - top_offer: dbt/models/export/vidoc/description__exp_vidoc__top_offer.md
          - top_offer_category: dbt/models/export/vidoc/description__exp_vidoc__top_offer_category.md
          - top_offer_labelled: dbt/models/export/vidoc/description__exp_vidoc__top_offer_labelled.md
          - top_venue: dbt/models/export/vidoc/description__exp_vidoc__top_venue.md
          - top_venue_labelled: dbt/models/export/vidoc/description__exp_vidoc__top_venue_labelled.md
        - Ministry:
          - dbt/ministry_kpis/index.md
          - User and deposits: dbt/ministry_kpis/user_and_deposit.md
          - Bookings: dbt/ministry_kpis/booking.md
          - Offers and stocks: dbt/ministry_kpis/offer_and_stock.md
          - Offerers and venues: dbt/ministry_kpis/offerer_and_venue.md
          - Geography tables: dbt/ministry_kpis/geography.md
      - Table definitions:
        - ... | dbt/models/**/description*.md
      - Methodology:
        - Statistical confidentiality: dbt/references/statistical_confidentiality.md
  - Glossary:
      - Overview: dbt/glossary.md
      - ... | dbt/glossary/*/column*.md
  - Data Science:
      - Overview: team/ds/overview.md
      - Recommendation: team/ds/recommendation.md
  - Data Engineering:
      - Overview: team/de/overview.md
      - Data Stack: team/de/data_stack.md
      - APIs & Connections: team/de/apis.md

  - About: about.md

# Plugins
plugins:
  - search:
      separator: "[\\s\\-.,;:_]+"
      lang: fr
  - include-markdown
  - awesome-pages
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >-
        Documentation for Pass Culture's data repository: dbt data models,
        KPIs, glossary, and data engineering/science references.
      sections:
        Platform:
          - project_structure_and_data_flow.md
        Data Models:
          - dbt/overview.md
          - dbt/kpis/**/*.md
          - dbt/vidoc/*.md
          - dbt/data_gouv/*.md
          - dbt/ministry_kpis/*.md
          - dbt/models/**/description*.md
        Glossary:
          - dbt/glossary.md
          - dbt/glossary/*/column*.md
        Teams:
          - team/ds/*.md
          - team/de/*.md

# Markdown Extensions
markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - meta
  - attr_list
  - tables
  - pymdownx.emoji
  - pymdownx.details
  - pymdownx.superfences
