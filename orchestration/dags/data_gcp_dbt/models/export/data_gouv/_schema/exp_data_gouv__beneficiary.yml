version: 2

models:
  - name: exp_data_gouv__beneficiary
    description: "{{ doc('description__exp_data_gouv__beneficiary') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - partition_month
              - department_name
              - age_at_calculation
              - is_in_qpv
              - macro_density_label
              - micro_density_label
      - dbt_utils.expression_is_true:
          arguments:
            # all-zero rows are not published (see the model)
            expression: "total_beneficiaries > 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_actual_beneficiaries <= total_beneficiaries"
      - dbt_utils.expression_is_true:
          arguments:
            # cell key perturbation: a published count is 0 or >= 5
            expression: "total_beneficiaries not between 1 and 4 and total_actual_beneficiaries not between 1 and 4"
    columns:
      - name: partition_month
        data_type: DATE
        description: "{{ doc('column__partition_month') }}"
        data_tests:
          - not_null
      - name: region_code
        data_type: STRING
        description: "{{ doc('column__region_code') }}"
        data_tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^[0-9]{2}$"
      - name: region_name
        data_type: STRING
        description: "{{ doc('column__region_name') }}"
        data_tests:
          - not_null
      - name: department_code
        data_type: STRING
        description: "{{ doc('column__department_code') }}"
        data_tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^([0-9]{2}|2A|2B|9[78][0-9])$"
      - name: department_name
        data_type: STRING
        description: "{{ doc('column__department_name') }}"
        data_tests:
          - not_null
      - name: age_at_calculation
        data_type: INT64
        description: "{{ doc('column__age_at_calculation') }}"
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                # impossible ages are published as unknown (see the model)
                expression: "age_at_calculation between 14 and 30"
              config:
                where: "age_at_calculation is not null"
      - name: is_in_qpv
        data_type: BOOL
        description: "{{ doc('column__user_is_in_qpv') }}"
      - name: macro_density_label
        data_type: STRING
        description: "{{ doc('column__user_macro_density_label') }}"
      - name: micro_density_label
        data_type: STRING
        description: "{{ doc('column__user_density_label') }}"
      - name: total_beneficiaries
        data_type: INT64
        description: "{{ doc('column__metrics__total_beneficiaries') }}"
        data_tests:
          - not_null
      - name: total_actual_beneficiaries
        data_type: INT64
        description: "{{ doc('column__metrics__total_actual_beneficiaries') }}"
        data_tests:
          - not_null
