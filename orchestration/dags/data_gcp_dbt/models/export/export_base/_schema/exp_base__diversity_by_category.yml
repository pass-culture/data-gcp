version: 2

models:
  - name: exp_base__diversity_by_category
    description: "{{ doc('description__exp_base__diversity_by_category') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - deposit_expiration_month
              - department_name
              - is_in_qpv
              - macro_density_label
              - micro_density_label
              - offer_category_id
      - dbt_utils.expression_is_true:
          arguments:
            # all-zero cells are left out (see the model)
            expression: "total_category_booked_beneficiaries > 0"
      - dbt_utils.expression_is_true:
          arguments:
            # cell key perturbation: a published count is 0 or >= 5
            expression: "coalesce(total_category_booked_beneficiaries, 0) not between 1 and 4"
    columns:
      - name: deposit_expiration_month
        description: "{{ doc('column__deposit_expiration_month') }}"
      - name: region_name
        description: "{{ doc('column__region_name') }}"
      - name: region_code
        description: "{{ doc('column__region_code') }}"
      - name: department_name
        description: "{{ doc('column__department_name') }}"
      - name: department_code
        description: "{{ doc('column__department_code') }}"
      - name: is_in_qpv
        description: "{{ doc('column__user_is_in_qpv') }}"
      - name: macro_density_label
        description: "{{ doc('column__user_macro_density_label') }}"
      - name: micro_density_label
        description: "{{ doc('column__user_density_label') }}"
      - name: offer_category_id
        description: "{{ doc('column__offer_category_id') }}"
      - name: total_category_booked_beneficiaries
        description: "{{ doc('column__metrics__total_category_booked_beneficiaries') }}"
