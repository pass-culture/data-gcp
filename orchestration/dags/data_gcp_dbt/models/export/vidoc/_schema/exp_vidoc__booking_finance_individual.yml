version: 2

models:
  - name: exp_vidoc__booking_finance_individual
    description: "{{ doc('description__exp_vidoc_booking_finance__individual') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - partition_month
            - venue_department_code
    columns:
      - name: partition_month
        description: "{{ doc('column__partition_month') }}"
        data_tests:
          - not_null
      - name: venue_department_code
        description: '{{ doc("column__venue_department_code") }}'
        data_tests:
          - not_null
      - name: venue_department_name
        description: '{{ doc("column__venue_department_name") }}'
      - name: venue_region_name
        description: '{{ doc("column__venue_region_name") }}'
      - name: venue_region_code
        description: '{{ doc("column__venue_region_code") }}'
      - name: is_statistic_secret
        description: "{{ doc('column__is_statistic_secret') }}"
      - name: department_secret_reason_code
        description: "{{ doc('column__department_secret_reason_code') }}"
      - name: department_secret_reason_label
        description: "{{ doc('column__department_secret_reason') }}"
      - name: total_bookings
        description: '{{ doc("column__finance_individual__total_bookings") }}'
      - name: total_quantities
        description: '{{ doc("column__total_quantities") }}'
      - name: total_revenue_amount
        description: '{{ doc("column__total_revenue_amount") }}'
      - name: total_reimbursed_amount
        description: '{{ doc("column__total_reimbursed_amount") }}'
      - name: total_contribution_amount
        description: '{{ doc("column__total_contribution_amount") }}'
