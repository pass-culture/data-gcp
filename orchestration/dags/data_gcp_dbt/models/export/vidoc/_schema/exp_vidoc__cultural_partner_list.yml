      - name: is_musique_disquaire
        data_type: BOOLEAN
        description: "True if the venue is in the partner type \"Musique - Disquaires\" (`musique_disquaire` in get_partner_types and in exp_vidoc__cultural_partner_by_type)."
        data_tests:
          - not_null
      - name: is_musique_instrument
        data_type: BOOLEAN
        description: "True if the venue is in the partner type \"Musique - Magasins d'instruments\" (`musique_instrument` in get_partner_types and in exp_vidoc__cultural_partner_by_type)."
        data_tests:
          - not_null
      - name: is_offre_numerique
        data_type: BOOLEAN
        description: "True if the venue is in the partner type \"Offre numérique\" (`offre_numerique` in get_partner_types and in exp_vidoc__cultural_partner_by_type)."
        data_tests:
          - not_null
      - name: is_patrimoine_tourisme
        data_type: BOOLEAN
        description: "True if the venue is in the partner type \"Patrimoine et tourisme\" (`patrimoine_tourisme` in get_partner_types and in exp_vidoc__cultural_partner_by_type)."
        data_tests:
          - not_null
