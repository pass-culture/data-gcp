        data_tests:
          - not_null
      - name: is_autre
        data_type: BOOLEAN
        description: "True if the venue is in the partner type \"Autres partenaires culturels\" (`autre` in get_partner_types and in exp_vidoc__cultural_partner_by_type)."
        data_tests:
          - not_null
      - name: is_bibliotheques_ou_mediatheques
        data_type: BOOLEAN
        description: "True if the venue is in the partner type \"Bibliothèques ou médiathèques\" (`bibliotheques_ou_mediatheques` in get_partner_types and in exp_vidoc__cultural_partner_by_type)."
        data_tests:
          - not_null
      - name: is_centre_culturel
        data_type: BOOLEAN
        description: "True if the venue is in the partner type \"Centres culturels\" (`centre_culturel` in get_partner_types and in exp_vidoc__cultural_partner_by_type)."
        data_tests:
          - not_null
      - name: is_pratique_art
        data_type: BOOLEAN
        description: "True if the venue is in the partner type \"Pratique artistique\" (`pratique_art` in get_partner_types and in exp_vidoc__cultural_partner_by_type)."
        data_tests:
          - not_null
      - name: is_culture_scientifique
        data_type: BOOLEAN
        description: "True if the venue is in the partner type \"Culture scientifique\" (`culture_scientifique` in get_partner_types and in exp_vidoc__cultural_partner_by_type)."
        data_tests:
          - not_null
      - name: is_festival
        data_type: BOOLEAN
        description: "True if the venue is in the partner type \"Festivals\" (`festival` in get_partner_types and in exp_vidoc__cultural_partner_by_type)."
        data_tests:
          - not_null
      - name: is_jeux_videos
        data_type: BOOLEAN
        description: "True if the venue is in the partner type \"Jeux vidéo\" (`jeux_videos` in get_partner_types and in exp_vidoc__cultural_partner_by_type)."
        data_tests:
          - not_null
      - name: is_magasins_arts_creatifs
        data_type: BOOLEAN
        description: "True if the venue is in the partner type \"Magasin arts créatifs\" (`magasins_arts_creatifs` in get_partner_types and in exp_vidoc__cultural_partner_by_type)."
        data_tests:
