version: 2

models:
  - name: exp_vidoc__offer_collective_bookable
    description: "{{ doc('description__exp_vidoc_offer_collective_bookable') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - partition_month
            - scholar_year
            - venue_department_code
    columns:
      - name: partition_month
        description: "{{ doc('column__partition_month') }}"
        data_tests:
          - not_null
      - name: scholar_year
        description: "{{ doc('column__reporting_scholar_year') }}"
        data_tests:
          - not_null
      - name: venue_region_name
        description: '{{ doc("column__venue_region_name") }}'
      - name: venue_region_code
        description: '{{ doc("column__venue_region_code") }}'
      - name: venue_department_name
        description: '{{ doc("column__venue_department_name") }}'
      - name: venue_department_code
        description: '{{ doc("column__venue_department_code") }}'
        data_tests:
          - not_null
      - name: total_created_bookable_collective_offers
        description: '{{ doc("column__total_created_bookable_collective_offers") }}'
      - name: total_prereserved_bookable_collective_offers
        description: '{{ doc("column__total_prereserved_bookable_collective_offers") }}'
      - name: new_bookable_offer_partners
        description: '{{ doc("column__new_bookable_offer_partners") }}'
