version: 2

models:
  - name: exp_vidoc__top_offer_labelled
    description: '{{ doc("description__exp_vidoc__top_offer_labelled") }}'
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - partition_month
              - geo_level
              - geo_value
              - venue_tag_name
              - offer_rank
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - partition_month
              - geo_level
              - geo_value
              - venue_tag_name
              - item_id
    columns:
      - name: partition_month
        description: '{{ doc("column__partition_month") }}'
        data_type: DATE
        data_tests:
          - not_null

      - name: geo_level
        description: '{{ doc("column__geo_level") }}'
        data_type: STRING
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['national', 'region', 'department']

      - name: geo_value
        description: '{{ doc("column__geo_value") }}'
        data_type: STRING
        data_tests:
          - not_null

      - name: item_id
        description: '{{ doc("column__item_id") }}'
        data_type: STRING
        data_tests:
          - not_null

      - name: offer_category_id
        description: '{{ doc("column__offer_category_id") }}'
        data_type: STRING
        data_tests:
          - not_null

      - name: offer_subcategory_id
        description: '{{ doc("column__offer_subcategory_id") }}'
        data_type: STRING

      - name: offer_name
        description: '{{ doc("column__offer_name") }}'
        data_type: STRING
        data_tests:
          - not_null

      - name: venue_tag_name
        description: '{{ doc("column__venue_tag_name") }}'
        data_type: STRING
        data_tests:
          - not_null

      - name: total_booking_amount
        description: '{{ doc("column__total_booking_amount") }}'
        data_type: FLOAT64
        data_tests:
          - not_null

      - name: total_booking_quantity
        description: '{{ doc("column__total_booking_quantity") }}'
        data_type: INT64
        data_tests:
          - not_null

      - name: offer_rank
        description: '{{ doc("column__offer_rank") }}'
        data_type: INT64
        data_tests:
          - not_null
