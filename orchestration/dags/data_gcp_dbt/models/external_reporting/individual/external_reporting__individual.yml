version: 2

models:
  - name: external_reporting__individual
    description: "{{ doc('description__external_reporting__individual') }}"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - partition_month
              - dimension_name
              - dimension_value
              - kpi_name
          config:
            severity: "{{ var('test_severity', {}).get(target.name, 'error') }}"
            tags: ['critical']
    columns:
      - name: partition_month
        description: "{{ doc('column__partition_month') }}"
        data_tests:
          - not_null:
              config:
                severity: "{{ var('test_severity', {}).get(target.name, 'error') }}"
                tags: ['critical']
      - name: updated_at
        description: "{{ doc('column__updated_at') }}"
      - name: dimension_name
        description: "{{ doc('column__dimension_name') }}"
        data_tests:
          - not_null:
              config:
                severity: "{{ var('test_severity', {}).get(target.name, 'error') }}"
                tags: ['critical']
          - accepted_values:
              arguments:
                values: ["NAT","DEP","REG","EPCI","COM"]
              config:
                severity: "{{ var('test_severity', {}).get(target.name, 'error') }}"
                tags: ['critical']
      - name: dimension_value
        description: "{{ doc('column__dimension_value') }}"
      - name: kpi_name
        description: "{{ doc('column__kpi_name') }}"
        data_tests:
          - not_null:
              config:
                severity: "{{ var('test_severity', {}).get(target.name, 'error') }}"
                tags: ['critical']
      - name: numerator
        description: "{{ doc('column__numerator') }}"
        data_tests:
          - not_null:
              config:
                where: "not is_secret_stat and not is_national_only"
                severity: "{{ var('test_severity', {}).get(target.name, 'error') }}"
                tags: ['critical']
      - name: denominator
        description: "{{ doc('column__denominator') }}"
        data_tests:
          - not_null:
              config:
                where: "not is_secret_stat and not is_national_only"
                severity: "{{ var('test_severity', {}).get(target.name, 'error') }}"
                tags: ['critical']
      - name: kpi
        description: "{{ doc('column__kpi') }}"
        data_tests:
          - not_null:
              config:
                where: "not is_secret_stat and not is_national_only"
                severity: "{{ var('test_severity', {}).get(target.name, 'error') }}"
                tags: ['critical']
          - kpi_variation_threshold:
              arguments:
                threshold: 0.5
              config:
                where: "dimension_name IN ('NAT')"
      - name: label
        description: "{{ doc('column__external_reporting_label') }}"
      - name: intitule
        description: "{{ doc('column__external_reporting_intitule') }}"
      - name: is_secret_stat
        description: "{{ doc('column__external_reporting_is_secret_stat') }}"
        data_tests:
          - not_null:
              config:
                severity: "{{ var('test_severity', {}).get(target.name, 'error') }}"
      - name: is_national_only
        description: "{{ doc('column__external_reporting_is_national_only') }}"
        data_tests:
          - not_null:
              config:
                severity: "{{ var('test_severity', {}).get(target.name, 'error') }}"
      - name: secret_reason
        description: "{{ doc('column__external_reporting_secret_reason') }}"
      - name: national_numerator
        description: "{{ doc('column__external_reporting_national_numerator') }}"
      - name: national_denominator
        description: "{{ doc('column__external_reporting_national_denominator') }}"
      - name: national_kpi
        description: "{{ doc('column__external_reporting_national_kpi') }}"
