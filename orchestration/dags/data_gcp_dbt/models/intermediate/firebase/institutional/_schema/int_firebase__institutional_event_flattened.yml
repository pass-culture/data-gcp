version: 2

models:
  - name: int_firebase__institutional_event_flattened
    description: "{{ doc('description__int_firebase__institutional_event_flattened') }}"
    columns:
      - name: event_date
        data_type: DATE
        description: "{{ doc('column__event_date') }}"
        data_tests:
          - generic_has_no_missing_partitions:
              arguments:
                where_condition: "event_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)"
      - name: event_name
        data_type: STRING
        description: "{{ doc('column__event_name') }}"
        data_tests:
          - not_null:
              config:
                where: "event_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)"
      - name: user_pseudo_id
        data_type: STRING
        description: "{{ doc('column__user_pseudo_id') }}"
