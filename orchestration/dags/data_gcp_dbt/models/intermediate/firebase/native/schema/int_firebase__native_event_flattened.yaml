version: 2

models:
  - name: int_firebase__native_event_flattened
    description: >-
      All raw Firebase events of the native app (iOS, Android, web), one row per event, with each event parameter extracted into its own column. Repeated 'ConsultOffer' events on the same offer within 3 seconds in the same session are deduplicated; is_anomaly flags inconsistent events.
    data_tests:
      - elementary.volume_anomalies:
          config:
            tags: [elementary]
          arguments:
            where_expression: "event_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 7 DAY)"
            timestamp_column: event_date
            time_bucket:
              period: day
              count: 1
    columns:
      - name: event_date
        description: '{{ doc("column__native_event_flattened_event_date") }}'
        data_type: DATE
        data_tests:
          - generic_has_no_missing_partitions:
              arguments:
                where_condition: "event_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 365 DAY)"

      - name: user_id
        description: '{{ doc("column__native_event_flattened_user_id") }}'
        data_type: STRING
        data_tests:
          - not_null_proportion:
              arguments:
                where_condition: "event_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY) and event_name = 'BookingConfirmation'"
                anomaly_threshold_alert_percentage: 1

      - name: user_pseudo_id
        description: '{{ doc("column__native_event_flattened_user_pseudo_id") }}'
        data_type: STRING
        data_tests:
          - not_null:
              config:
                where: "event_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)"

      - name: event_name
        description: '{{ doc("column__native_event_flattened_event_name") }}'
        data_type: STRING
        data_tests:
          - not_null:
              config:
                where: "event_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)"

      - name: event_timestamp
        description: '{{ doc("column__event_timestamp") }}'
        data_type: TIMESTAMP

      - name: event_previous_timestamp
        description: '{{ doc("column__native_event_flattened_event_previous_timestamp") }}'
        data_type: TIMESTAMP

      - name: user_first_touch_timestamp
        description: '{{ doc("column__native_event_flattened_user_first_touch_timestamp") }}'
        data_type: TIMESTAMP

      - name: platform
        description: '{{ doc("column__native_event_flattened_platform") }}'
        data_type: STRING

      - name: name
        description: '{{ doc("column__institutional_event_user_traffic_campaign") }}'
        data_type: STRING

      - name: medium
        description: '{{ doc("column__institutional_event_user_traffic_medium") }}'
        data_type: STRING

      - name: source
        description: '{{ doc("column__institutional_event_user_traffic_source") }}'
        data_type: STRING

      - name: app_version
        description: '{{ doc("column__app_version") }}'
        data_type: STRING

      - name: double_offer_id
        description: '{{ doc("column__native_event_flattened_double_offer_id") }}'
        data_type: FLOAT64

      - name: ga_session_id
        description: '{{ doc("column__native_event_flattened_ga_session_id") }}'
        data_type: INT64

      - name: ga_session_number
        description: '{{ doc("column__session_number") }}'
        data_type: INT64

      - name: shouldUseAlgoliaRecommend
        description: '{{ doc("column__native_event_flattened_should_use_algolia_recommend") }}'
        data_type: INT64

      - name: searchIsAutocomplete
