version: 2

models:
  - name: int_kpi__cultural_partner_offerer_revenue
    description: '{{ doc("description__int_kpi__cultural_partner_offerer_revenue") }}'
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - partition_month
              - booking_type
              - offerer_id
              - municipality_code
    columns:
      - name: partition_month
        description: '{{ doc("column__partition_month") }}'
        data_type: DATE
        data_tests:
          - not_null

      - name: booking_type
        description: '{{ doc("column__booking_type") }}'
        data_type: STRING
        data_tests:
          - accepted_values:
              arguments:
                values: ["individual", "collective"]

      - name: offerer_id
        description: '{{ doc("column__offerer_id") }}'
        data_type: STRING

      - name: municipality_code
        description: '{{ doc("column__municipality_code") }}'
        data_type: STRING

      - name: epci_code
        description: '{{ doc("column__epci_code") }}'
        data_type: STRING

      - name: department_code
        description: '{{ doc("column__department_code") }}'
        data_type: STRING

      - name: total_revenue_amount
        description: '{{ doc("column__total_revenue_amount") }}'
