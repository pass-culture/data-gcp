version: 2

models:
  - name: int_pcapi__bonus_log
    description: "{{ doc('description__int_pcapi__bonus_log') }}"
    columns:
      - name: partition_date
        description: "{{ doc('column__partition_date') }}"
        data_tests:
          - not_null

      - name: log_started_at
        description: "{{ doc('column__log_started_at') }}"
        data_tests:
          - not_null

      - name: log_ended_at
        description: "{{ doc('column__log_ended_at') }}"
        data_tests:
          - not_null

      - name: bonus_type
        description: "{{ doc('column__bonus_type') }}"

      - name: status
        description: "{{ doc('column__status') }}"
        data_tests:
          - not_null
          - accepted_values:
              values: ['grant', 'error', 'attempt']

      - name: error_reason
        description: "{{ doc('column__error_reason') }}"

      - name: attempts_count
        description: "{{ doc('column__attempts_count') }}"

      - name: total_requests
        description: "{{ doc('column__total_requests') }}"
        data_tests:
          - not_null
