version: 2

models:
  - name: int_pcapi__booking_log
    description: "{{ doc('description__int_pcapi__booking_log') }}"
    columns:
      - name: partition_date
        description: "{{ doc('column__partition_date') }}"
        data_tests:
          - not_null:
              config:
                where: "partition_date > date_sub('{{ var('ds', modules.datetime.date.today().strftime('%Y-%m-%d')) }}', interval 14 day)"
      - name: log_timestamp
        description: "{{ doc('column__log_timestamp') }}"
        data_tests:
          - not_null:
              config:
                where: "partition_date > date_sub('{{ var('ds', modules.datetime.date.today().strftime('%Y-%m-%d')) }}', interval 14 day)"
      - name: technical_message_id
        description: "{{ doc('column__technical_message_id') }}"
      - name: severity
        description: "{{ doc('column__severity') }}"
        data_tests:
          - not_null:
              config:
                where: "partition_date > date_sub('{{ var('ds', modules.datetime.date.today().strftime('%Y-%m-%d')) }}', interval 14 day)"
      - name: message
        description: "{{ doc('column__message') }}"
      - name: exception_class
        description: "{{ doc('column__exception_class') }}"
      - name: exception_message
        description: "{{ doc('column__exception_message') }}"
      - name: user_id
        description: "{{ doc('column__user_id') }}"
      - name: booking_id
        description: "{{ doc('column__booking_id') }}"
      - name: offer_id
        description: "{{ doc('column__offer_id') }}"
      - name: stock_id
        description: "{{ doc('column__stock_id') }}"
      - name: venue_id
        description: "{{ doc('column__venue_id') }}"
      - name: provider_id
        description: "{{ doc('column__provider_id') }}"
      - name: booking_quantity
        description: "{{ doc('column__booking_quantity') }}"
      - name: trace
        description: "{{ doc('column__trace') }}"
      - name: extra_json
        description: "{{ doc('column__extra_json') }}"
      - name: booking_action
        description: "{{ doc('column__booking_action') }}"
        data_tests:
          - not_null:
              config:
                where: "partition_date > date_sub('{{ var('ds', modules.datetime.date.today().strftime('%Y-%m-%d')) }}', interval 14 day)"
      - name: is_success
        description: "{{ doc('column__is_success') }}"
      - name: failure_reason
        description: "{{ doc('column__failure_reason') }}"
      - name: failure_type
        description: "{{ doc('column__failure_type') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['business', 'technical']
              config:
                where: "partition_date > date_sub('{{ var('ds', modules.datetime.date.today().strftime('%Y-%m-%d')) }}', interval 14 day)"
