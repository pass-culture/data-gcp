version: 2

models:
  - name: int_seed__department_location
    description: |
      Geographic centroid (latitude / longitude) per French department,
      computed by aggregating all IRIS centroids within the department.
    columns:
      - name: department_code
        description: "{{ doc('column__department_code') }}"
        data_tests:
          - not_null
          - unique
      - name: department_latitude
        description: "Latitude of the centroid of the department, derived from IRIS centroids via st_centroid_agg."
      - name: department_longitude
        description: "Longitude of the centroid of the department, derived from IRIS centroids via st_centroid_agg."
