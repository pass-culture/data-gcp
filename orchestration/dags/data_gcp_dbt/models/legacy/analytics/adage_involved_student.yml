version: 2

models:
  - name: adage_involved_student
    tests:
      - dbt_utils.recency:
          arguments:
            field: date
            datepart: day
            interval: 3
            ignore_time_component: true
          config:
            severity: "{{ var('test_severity', {}).get(target.name, 'error') }}"
            tags: ['critical']
