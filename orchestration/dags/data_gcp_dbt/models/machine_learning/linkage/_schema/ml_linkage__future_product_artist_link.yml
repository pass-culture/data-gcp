version: 2

models:
  - name: ml_linkage__future_product_artist_link
    description: "{{ doc('description__ml_linkage__future_product_artist_link') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - offer_product_id
              - artist_id
              - artist_type
          config:
            severity: "{{ var('test_severity', {}).get(target.name, 'error') }}"
            tags: ['critical']
    columns:
      - name: offer_product_id
        description: "{{ doc('column__offer_product_id') }}"
        data_tests:
          - not_null:
              config:
                severity: "{{ var('test_severity', {}).get(target.name, 'error') }}"
                tags: ['critical']
          - dbt_utils.not_empty_string:
              config:
                severity: "{{ var('test_severity', {}).get(target.name, 'error') }}"
                tags: ['critical']

      - name: artist_id
        description: "{{ doc('column__artist_id') }}"
        data_tests:
          - not_null:
              config:
                severity: "{{ var('test_severity', {}).get(target.name, 'error') }}"
                tags: ['critical']
          - dbt_utils.not_empty_string:
              config:
                severity: "{{ var('test_severity', {}).get(target.name, 'error') }}"
                tags: ['critical']
          - relationships:
              arguments:
                to: ref('ml_linkage__future_artist')
                field: artist_id
              config:
                severity: "{{ var('test_severity', {}).get(target.name, 'error') }}"
                tags: ['critical']

      - name: artist_type
        description: "{{ doc('column__artist_type') }}"
        data_tests:
          - not_null:
              config:
                severity: "{{ var('test_severity', {}).get(target.name, 'error') }}"
                tags: ['critical']
