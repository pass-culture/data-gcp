version: 2

models:
  - name: mrt_global__identity_check
    description: '{{ doc("description__mrt_global__identity_check") }}'
    columns:
      - name: identity_check_id
        description: '{{ doc("column__identity_check_id") }}'
        data_type: STRING
        data_tests:
          - unique
          - not_null
      - name: user_id
        description: '{{ doc("column__user_id") }}'
        data_type: STRING
        data_tests:
          - not_null
      - name: identity_check_type
        description: '{{ doc("column__identity_check_type") }}'
        data_type: STRING
        data_tests:
          - accepted_values:
              arguments:
                values: ['UBBLE', 'DMS', 'EDUCONNECT', 'JOUVE']
      - name: identity_check_status
        description: '{{ doc("column__identity_check_status") }}'
        data_type: STRING
      - name: identity_check_eligibility_type
        description: '{{ doc("column__identity_check_eligibility_type") }}'
        data_type: STRING
      - name: identity_check_reason_code
        description: '{{ doc("column__identity_check_reason_code") }}'
        data_type: STRING
      - name: identity_check_creation_date
        description: '{{ doc("column__identity_check_creation_date") }}'
        data_type: DATETIME
      - name: identity_check_update_date
        description: '{{ doc("column__identity_check_update_date") }}'
        data_type: DATETIME
