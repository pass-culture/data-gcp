version: 2

models:
  - name: metrics_beneficiary
    description: "{{ doc('description__metrics_beneficiary') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - partition_month
            - region_code
            - department_code
            - epci_code
            - city_code
            - municipality_code
            - age_at_calculation
            - is_in_qpv
            - macro_density_label
            - micro_density_label
    columns:
      - name: partition_month
        description: "{{ doc('column__partition_month') }}"
        data_tests:
          - not_null

      - name: region_name
        description: "{{ doc('column__region_name') }}"

      - name: region_code
        description: "{{ doc('column__region_code') }}"

      - name: department_name
        description: "{{ doc('column__department_name') }}"

      - name: department_code
        description: "{{ doc('column__department_code') }}"

      - name: epci_name
        description: "{{ doc('column__user_epci') }}"

      - name: epci_code
        description: "{{ doc('column__user_epci_code') }}"

      - name: city_name
        description: "{{ doc('column__user_city') }}"

      - name: city_code
        description: "{{ doc('column__user_city_code') }}"

      - name: municipality_label
        description: "{{ doc('column__user_municipality_label') }}"

      - name: municipality_code
        description: "{{ doc('column__municipality_code') }}"
        data_tests:
          - not_null

      - name: age_at_calculation
        description: "{{ doc('column__age_at_calculation') }}"

      - name: is_in_qpv
        description: "{{ doc('column__user_is_in_qpv') }}"

      - name: macro_density_label
        description: "{{ doc('column__user_macro_density_label') }}"

      - name: micro_density_label
        description: "{{ doc('column__user_density_label') }}"

      - name: total_actual_beneficiaries
