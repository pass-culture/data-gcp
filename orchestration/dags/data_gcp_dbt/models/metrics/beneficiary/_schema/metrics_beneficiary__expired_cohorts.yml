version: 2

models:
  - name: metrics_beneficiary__expired_cohorts
    description: "{{ doc('description__metrics_beneficiary__expired_cohorts') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - deposit_expiration_month
            - department_code
            - region_name
            - epci_code
            - city_code
            - municipality_code
            - is_in_qpv
            - macro_density_label
            - micro_density_label
    columns:
      - name: deposit_expiration_month
        description: "{{ doc('column__expired_cohorts__deposit_expiration_month') }}"
        data_type: DATE
        data_tests:
          - not_null
      - name: region_name
        description: "{{ doc('column__user_region_name') }}"
        data_type: STRING
      - name: department_name
        description: "{{ doc('column__user_department_name') }}"
        data_type: STRING
      - name: department_code
        description: "{{ doc('column__user_department_code') }}"
        data_type: STRING
      - name: epci_name
        description: "{{ doc('column__user_epci') }}"
        data_type: STRING
      - name: epci_code
        description: "{{ doc('column__user_epci_code') }}"
        data_type: STRING
      - name: city_code
        description: "{{ doc('column__user_city_code') }}"
        data_type: STRING
      - name: city_name
        description: "{{ doc('column__user_city') }}"
        data_type: STRING
      - name: municipality_label
        description: "{{ doc('column__user_municipality_label') }}"
        data_type: STRING
      - name: municipality_code
        description: "{{ doc('column__municipality_code') }}"
        data_type: STRING
      - name: is_in_qpv
        description: "{{ doc('column__user_is_in_qpv') }}"
        data_type: BOOLEAN
      - name: macro_density_label
        description: "{{ doc('column__user_macro_density_label') }}"
        data_type: STRING
      - name: micro_density_label
        description: "{{ doc('column__user_density_label') }}"
        data_type: STRING
      - name: total_expired_deposit_beneficiaries
        description: "{{ doc('column__metrics__total_expired_deposit_beneficiaries') }}"
        data_type: INT64
        data_tests:
          - not_null
      - name: total_deposit_amount_at_expiration
        description: "{{ doc('column__metrics__total_deposit_amount_at_expiration') }}"
        data_type: NUMERIC
        data_tests:
          - not_null
      - name: average_deposit_amount_at_expiration
        description: "{{ doc('column__metrics__average_deposit_amount_at_expiration') }}"
        data_type: NUMERIC
      - name: total_actual_amount_spent_at_expiration
        description: "{{ doc('column__metrics__total_actual_amount_spent_at_expiration') }}"
        data_type: NUMERIC
        data_tests:
          - not_null
      - name: average_actual_amount_spent_at_expiration
        description: "{{ doc('column__metrics__average_actual_amount_spent_at_expiration') }}"
        data_type: NUMERIC
