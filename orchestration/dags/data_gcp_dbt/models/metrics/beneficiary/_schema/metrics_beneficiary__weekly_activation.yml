version: 2

models:
  - name: metrics_beneficiary__weekly_activation
    description: "{{ doc('description__metrics_beneficiary__weekly_activation') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - signup_week
            - age_at_signup
    columns:
      - name: signup_week
        description: "{{ doc('column__signup_week') }}"
        data_tests:
          - not_null

      - name: age_at_signup
        description: "{{ doc('column__age_at_signup') }}"
        data_tests:
          - not_null

      - name: total_onboarding_users
        description: "{{ doc('column__total_onboarding_users') }}"
        data_tests:
          - not_null

      - name: total_validated_7d_users
        description: "{{ doc('column__total_validated_7d_users') }}"
        data_tests:
          - not_null

      - name: total_registered_beneficiaries
        description: "{{ doc('column__total_registered_beneficiaries') }}"
        data_tests:
          - not_null

      - name: total_activated_7d_beneficiaries
        description: "{{ doc('column__total_activated_7d_beneficiaries') }}"
        data_tests:
          - not_null

      - name: pct_activated_7d_beneficiaries
        description: "{{ doc('column__pct_activated_7d_beneficiaries') }}"
        data_tests:
          - not_null

      - name: pct_validated_7d_users
        description: "{{ doc('column__pct_validated_7d_users') }}"
        data_tests:
          - not_null
