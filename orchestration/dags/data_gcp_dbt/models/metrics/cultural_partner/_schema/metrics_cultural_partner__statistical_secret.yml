version: 2

models:
  - name: metrics_cultural_partner__statistical_secret
    description: '{{ doc("description__metrics_cultural_partner__statistical_secret") }}'
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - partition_month
              - booking_type
              - geo_level
              - geo_code
      - dbt_utils.expression_is_true:
          name: metrics_cultural_partner__statistical_secret_remainders_are_publishable
          arguments:
            expression: "not is_statistic_secret"
          config:
            where: "geo_level like '%_remainder'"
    columns:
      - name: partition_month
        description: '{{ doc("column__partition_month") }}'
        data_type: DATE
        data_tests:
          - not_null

      - name: period_label
        description: '{{ doc("column__period_label") }}'
        data_type: STRING

      - name: booking_type
        description: '{{ doc("column__booking_type") }}'
        data_type: STRING
        data_tests:
          - accepted_values:
              arguments:
                values: ["individual", "collective"]

      - name: geo_level
        description: '{{ doc("column__geo_level") }}'
        data_type: STRING
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - country
                  - department
                  - epci
                  - municipality
                  - epci_remainder
                  - department_remainder
                  - country_remainder

      - name: geo_code
        description: '{{ doc("column__geo_code") }}'
        data_type: STRING
        data_tests:
          - not_null

      - name: geo_label
        description: '{{ doc("column__geo_label") }}'
        data_type: STRING

      - name: population
        description: '{{ doc("column__population") }}'

      - name: total_contributing_offerers
        description: '{{ doc("column__total_contributing_offerers") }}'
        data_type: INT64

      - name: total_revenue_amount
        description: '{{ doc("column__total_revenue_amount") }}'

      - name: max_offerer_revenue_share
        description: '{{ doc("column__max_offerer_revenue_share") }}'

      - name: is_primary_secret
        description: '{{ doc("column__is_primary_secret") }}'
        data_type: BOOLEAN

      - name: is_statistic_secret
        description: '{{ doc("column__is_statistic_secret") }}'
        data_type: BOOLEAN
        data_tests:
          - not_null

      - name: statistic_secret_reason
        description: '{{ doc("column__statistic_secret_reason") }}'
        data_type: STRING
