version: 2

models:
  - name: metrics_diversity
    description: "{{ doc('description__metrics_diversity') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - deposit_expiration_month
              - region_name
              - region_code
              - department_name
              - department_code
              - epci_name
              - epci_code
              - city_name
              - city_code
              - municipality_label
              - municipality_code
              - is_in_qpv
              - macro_density_label
              - micro_density_label
    columns:
      - name: deposit_expiration_month
        description: "{{ doc('column__deposit_expiration_month') }}"
        data_type: DATE
        data_tests:
          - not_null
      - name: is_statistic_secret
        description: "{{ doc('column__is_statistic_secret') }}"
        data_type: BOOLEAN
      - name: region_name
        description: "{{ doc('column__region_name') }}"
        data_type: STRING
      - name: region_code
        description: "{{ doc('column__region_code') }}"
        data_type: INT64
      - name: department_name
        description: "{{ doc('column__department_name') }}"
        data_type: STRING
      - name: department_code
        description: "{{ doc('column__department_code') }}"
        data_type: STRING
      - name: epci_name
        description: "{{ doc('column__user_epci') }}"
        data_type: STRING
      - name: epci_code
        description: "{{ doc('column__user_epci_code') }}"
        data_type: STRING
      - name: city_name
        description: "{{ doc('column__user_city') }}"
        data_type: STRING
      - name: city_code
        description: "{{ doc('column__user_city_code') }}"
        data_type: STRING
      - name: municipality_label
        description: "{{ doc('column__user_municipality_label') }}"
