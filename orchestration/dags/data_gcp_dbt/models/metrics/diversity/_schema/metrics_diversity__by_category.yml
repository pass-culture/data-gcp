version: 2

models:
  - name: metrics_diversity__by_category
    description: "{{ doc('description__metrics_diversity__by_category') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - deposit_expiration_month
              - region_name
              - region_code
              - department_name
              - department_code
              - epci_name
              - epci_code
              - city_name
              - city_code
              - municipality_label
              - municipality_code
              - is_in_qpv
              - macro_density_label
              - micro_density_label
              - offer_category_id
    columns:
      - name: deposit_expiration_month
        description: "{{ doc('column__deposit_expiration_month') }}"
        data_tests:
          - not_null
      - name: is_statistic_secret
        description: "{{ doc('column__is_statistic_secret') }}"
      - name: region_name
        description: "{{ doc('column__region_name') }}"
      - name: region_code
        description: "{{ doc('column__region_code') }}"
      - name: department_name
        description: "{{ doc('column__department_name') }}"
      - name: department_code
        description: "{{ doc('column__department_code') }}"
      - name: epci_name
        description: "{{ doc('column__user_epci') }}"
      - name: epci_code
        description: "{{ doc('column__user_epci_code') }}"
      - name: city_name
        description: "{{ doc('column__user_city') }}"
      - name: city_code
        description: "{{ doc('column__user_city_code') }}"
      - name: municipality_label
        description: "{{ doc('column__user_municipality_label') }}"
      - name: municipality_code
        description: "{{ doc('column__municipality_code') }}"
      - name: is_in_qpv
        description: "{{ doc('column__user_is_in_qpv') }}"
      - name: macro_density_label
        description: "{{ doc('column__user_macro_density_label') }}"
      - name: micro_density_label
        description: "{{ doc('column__user_density_label') }}"
      - name: total_category_booked_beneficiaries
        description: "{{ doc('column__metrics__total_category_booked_beneficiaries') }}"
      - name: offer_category_id
        description: "{{ doc('column__offer_category_id') }}"
        data_type: STRING
      - name: cell_key_category
        description: "{{ doc('column__cell_key') }}"
        data_type: INT64
