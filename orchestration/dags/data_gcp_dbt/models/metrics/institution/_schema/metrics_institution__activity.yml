version: 2

models:
  - name: metrics_institution__activity
    description: "{{ doc('description__metrics_institution__activity') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - partition_month
              - scholar_year
              - institution_region_name
              - institution_academy_name
              - institution_department_name
              - institution_epci_code
              - institution_city_code
              - institution_municipality_code
    columns:
      - name: partition_month
        description: "{{ doc('column__partition_month') }}"
        data_type: DATE
        data_tests:
          - not_null
      - name: scholar_year
        description: "{{ doc('column__scholar_year') }}"
        data_type: STRING
      - name: institution_region_name
        description: "{{ doc('column__institution_region_name') }}"
        data_type: STRING
      - name: institution_academy_name
        description: "{{ doc('column__institution_academy_name') }}"
        data_type: STRING
      - name: institution_department_name
        description: "{{ doc('column__institution_department_name') }}"
        data_type: STRING
      - name: institution_epci_code
        description: "{{ doc('column__institution_epci_code') }}"
        data_type: STRING
      - name: institution_city_code
        description: "{{ doc('column__institution_city_code') }}"
        data_type: STRING
      - name: institution_municipality_code
        description: "{{ doc('column__institution_municipality_code') }}"
        data_type: STRING
      - name: total_institutions
        description: "{{ doc('column__metrics__total_institutions') }}"
        data_type: INT64
      - name: total_engaged_institutions
        description: "{{ doc('column__metrics__total_engaged_institutions') }}"
        data_type: INT64
      - name: total_ever_credited_institutions
        description: "{{ doc('column__metrics__total_ever_credited_institutions') }}"
        data_type: INT64
      - name: total_deposit
        description: "{{ doc('column__metrics__total_deposit') }}"
        data_type: FLOAT64
      - name: total_amount_spent
        description: "{{ doc('column__metrics__total_amount_spent') }}"
        data_type: FLOAT64
      - name: total_bookings
        description: "{{ doc('column__metrics__total_bookings') }}"
        data_type: INT64
      - name: cumulative_total_amount_spent
        description: "{{ doc('column__metrics__cumulative_total_amount_spent') }}"
        data_type: FLOAT64
      - name: cumulative_total_bookings
        description: "{{ doc('column__metrics__cumulative_total_bookings') }}"
        data_type: INT64
