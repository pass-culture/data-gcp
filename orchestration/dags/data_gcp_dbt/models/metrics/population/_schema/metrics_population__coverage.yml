version: 2

models:
  - name: metrics_population__coverage
    description: "{{ doc('description__metrics_population__coverage') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - partition_month
              - birth_month
              - milestone_age
              - department_code
              - department_name
              - region_name
              - region_code
    columns:
      - name: partition_month
        description: "{{ doc('column__partition_month') }}"
        data_type: DATE
        data_tests:
          - not_null
      - name: birth_month
        description: "{{ doc('column__population_birth_month') }}"
        data_type: DATE
      - name: milestone_age
        description: "{{ doc('column__milestone_age') }}"
        data_type: STRING
      - name: department_code
        description: "{{ doc('column__department_code') }}"
        data_type: STRING
      - name: department_name
        description: "{{ doc('column__department_name') }}"
        data_type: STRING
      - name: region_name
        description: "{{ doc('column__region_name') }}"
        data_type: STRING
      - name: region_code
        description: "{{ doc('column__region_code') }}"
        data_type: INT64
      - name: total_population_last_12_months
        description: "{{ doc('column__total_population_last_12_months') }}"
        data_type: INT64
