version: 2

models:
  - name: statistical_secret__cultural_partner_individual
    description: '{{ doc("description__statistical_secret__cultural_partner_individual") }}'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - partition_month
            - rolling_window_months_count
            - municipality_code
    columns:
      - name: partition_month
        description: '{{ doc("column__partition_month") }}'
        data_type: DATE
        tests:
          - not_null

      - name: rolling_window_months_count
        description: '{{ doc("column__rolling_window_months_count") }}'
        data_type: INT64
        tests:
          - not_null
          - accepted_values:
              values: [6, 48]

      - name: department_code
        description: '{{ doc("column__department_code") }}'
        data_type: STRING

      - name: department_label
        description: '{{ doc("column__department_name") }}'
        data_type: STRING

      - name: epci_code
        description: '{{ doc("column__epci_code") }}'
        data_type: STRING

      - name: epci_label
        description: '{{ doc("column__epci_label") }}'
        data_type: STRING

      - name: municipality_code
        description: '{{ doc("column__municipality_code") }}'
        data_type: STRING
        tests:
          - not_null

      - name: municipality_label
        description: '{{ doc("column__municipality_label") }}'
        data_type: STRING

      - name: total_active_partners_count_department
        description: '{{ doc("column__total_active_partners_count_department") }}'
        data_type: INT64

      - name: max_partner_revenue_share_department
        description: '{{ doc("column__max_partner_revenue_share_department") }}'
        data_type: FLOAT64

      - name: total_revenue_amount_department
        description: '{{ doc("column__total_revenue_amount_department") }}'
        data_type: FLOAT64

      - name: total_active_partners_count_epci
        description: '{{ doc("column__total_active_partners_count_epci") }}'
        data_type: INT64

      - name: max_partner_revenue_share_epci
        description: '{{ doc("column__max_partner_revenue_share_epci") }}'
        data_type: FLOAT64

      - name: total_revenue_amount_epci
        description: '{{ doc("column__total_revenue_amount_epci") }}'
        data_type: FLOAT64

      - name: total_active_partners_count_municipality
        description: '{{ doc("column__total_active_partners_count_municipality") }}'
        data_type: INT64

      - name: max_partner_revenue_share_municipality
        description: '{{ doc("column__max_partner_revenue_share_municipality") }}'
        data_type: FLOAT64

      - name: total_revenue_amount_municipality
        description: '{{ doc("column__total_revenue_amount_municipality") }}'
        data_type: FLOAT64

      - name: is_department_secret
        description: '{{ doc("column__is_department_secret") }}'
        data_type: BOOLEAN
        tests:
          - not_null

      - name: is_epci_secret
        description: '{{ doc("column__is_epci_secret") }}'
        data_type: BOOLEAN
        tests:
          - not_null

      - name: is_municipality_secret
        description: '{{ doc("column__is_municipality_secret") }}'
        data_type: BOOLEAN
        tests:
          - not_null

      - name: department_secret_reason_code
        description: '{{ doc("column__department_secret_reason_code") }}'
        data_type: STRING
        tests:
          - not_null
          - accepted_values:
              values: ['no_revenue', 'low_partners', 'high_concentration', 'both', 'none']

      - name: epci_secret_reason_code
        description: '{{ doc("column__epci_secret_reason_code") }}'
        data_type: STRING
        tests:
          - not_null
          - accepted_values:
              values: ['no_revenue', 'low_partners', 'high_concentration', 'both', 'none']

      - name: municipality_secret_reason_code
        description: '{{ doc("column__municipality_secret_reason_code") }}'
        data_type: STRING
        tests:
          - not_null
          - accepted_values:
              values: ['no_revenue', 'low_partners', 'high_concentration', 'both', 'none']

      - name: department_secret_reason_label
        description: '{{ doc("column__department_secret_reason") }}'
        data_type: STRING

      - name: epci_secret_reason_label
        description: '{{ doc("column__epci_secret_reason") }}'
        data_type: STRING

      - name: municipality_secret_reason_label
        description: '{{ doc("column__municipality_secret_reason") }}'
        data_type: STRING
