environments:
  tst:
    source_project: passculture-data-ehp
    source_suffix: dev
    destination_project: pc-data-tst
    destination_suffix: tst
  stg:
    source_project: passculture-data-ehp
    source_suffix: stg
    destination_project: pc-data-stg
    destination_suffix: stg
  prd:
    source_project: passculture-data-prod
    source_suffix: prod
    destination_project: pc-data-prd
    destination_suffix: prd

dags_in_paris:
  import_gsheet:
    source_dataset: raw
    tables_to_copy: [] # full refresh -> no tables to copy
  import_adage_v1:
    source_dataset: raw
    tables_to_copy: [adage, adage_involved_student] # incremental (append + partitioned load) -> copy history
  import_allocine_movies:
    source_dataset: raw
    tables_to_copy: [allocine_movies] # incremental via MERGE on raw table -> copy history
  import_api_referentials:
    source_dataset: raw
    tables_to_copy: [] # full refresh -> no tables to copy
  import_appfollow:
    source_dataset: raw
    tables_to_copy: [appfollow_reviews, appfollow_ratings] # delete+append by date window over raw tables -> copy history
  import_batch:
    source_dataset: raw
    tables_to_copy: [batch_campaigns_stats, batch_transac] # incremental append/partitioned raw loads -> copy history
  import_brevo:
    source_dataset: raw
    tables_to_copy: [sendinblue_transactional, sendinblue_newsletters_histo, sendinblue_pro_newsletters_histo] # incremental partitioned raw loads -> copy history
  import_contentful:
    source_dataset: raw
    tables_to_copy: [contentful_entry, contentful_relationship, contentful_tag] # incremental partitioned raw loads -> copy history
  import_dms_subscriptions:
    source_dataset: raw
    tables_to_copy: [raw_dms_jeunes, raw_dms_pro] # incremental append loads -> copy history
  import_downloads:
    source_dataset: raw
    tables_to_copy: [apple_download_stats, google_download_stats] # delete+append by date window on raw tables -> copy history
  import_gcs_seed:
    source_dataset: seed
    tables_to_copy: [] # full refresh from GCS snapshots -> no tables to copy
  import_geo_referential:
    source_dataset: raw
    tables_to_copy: [] # full snapshot rebuilt from external sources -> no tables to copy
  import_harvestr:
    source_dataset: raw
    tables_to_copy: [harvestr_messages] # partitioned raw history loaded by date window -> copy history
  import_insee_population:
    source_dataset: raw
    tables_to_copy: [] # monthly refresh job -> no explicit incremental history copy
  import_notion:
    source_dataset: raw
    tables_to_copy: [notion_dashboard_docs] # partitioned daily raw loads -> copy history
  import_qualtrics:
    source_dataset: raw
    tables_to_copy: [qualtrics_answers] # append/range-partitioned survey answers -> copy history
  import_siren_v1:
    source_dataset: raw
    tables_to_copy: [siren_data] # WRITE_APPEND to raw table -> copy history
  import_siret_v1:
    source_dataset: raw
    tables_to_copy: [siret_data] # WRITE_APPEND to raw table -> copy history
  import_social_network:
    source_dataset: raw
    tables_to_copy: [instagram_account_daily_activity, instagram_account, instagram_post_detail, tiktok_video_detail, tiktok_video_audience_country, tiktok_video_impression_source, tiktok_account_hourly_audience, tiktok_account_daily_activity] # per-partition ($yyyymmdd) WRITE_TRUNCATE daily loads -> copy history
  import_titelive:
    source_dataset: raw
    tables_to_copy: [] # writes to tmp staging table, TRUNCATEd + rebuilt each run -> no tables to copy
  import_user_address_bulk:
    source_dataset: raw
    tables_to_copy: [user_address] # WRITE_APPEND to raw table -> copy history
  import_zendesk:
    source_dataset: raw
    tables_to_copy: [zendesk_macro_usage, zendesk_ticket, zendesk_survey_response] # per-partition ($yyyymmdd) WRITE_TRUNCATE daily loads -> copy history
  import_metabase:
    source_dataset: raw
    tables_to_copy: []
