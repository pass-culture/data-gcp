[project]
name = "data-gcp"
version = "0.1.1"
description = "Data Engineering GCP Project for Pass Culture"
requires-python = ">=3.12,<3.13"

[dependency-groups]
airflow = [
  "apache-airflow[fab,google,google-auth,celery,ssh,cncf-kubernetes,uv]==2.11.2",
  "statsd<=4.0.1",
  "dbt-core==1.11.8",
  "dbt-bigquery==1.11.1",
  "psycopg2-binary==2.9.9",
  "elementary-data[bigquery]==0.23.1",
  "google-cloud-bigquery-storage==2.33.1",
  "flask-openid>=1.3.1",
  "flask-oidc>=2.2.2",
  "typer",
  "sqlglot",
  "deepdiff==8.6.2",
  "pyyaml==6.0.2",
  "numpy",
  "flask",
  "pyyaml",
]
dbt = [
  "dbt-core==1.11.8",
  "dbt-bigquery==1.11.1",
  "dbt-metabase==1.7.3",
  "dbt-colibri>=0.3.0",
  "deepdiff==8.6.2",
]
docs = [
  "mkdocs-material>=9.7.7",
  "mkdocs-awesome-pages-plugin==2.9.3",
  "mkdocs-include-markdown-plugin",
  "mkdocs-llmstxt",
  "pandas==2.2.3",
  "tabulate==0.9.0",
]
dev = [
  "pytest>=7.4.4",
  "pytest-cov>=5.0.0",
  "mock>=4.0.2",
  "ruff==0.5.7",
  "typer~=0.13.1",
  "pre-commit~=4.2.0",
  "shandy-sqlfmt[jinjafmt]==0.29.0",
  "sqlfluff==4.4.0",
  "sqlfluff-templater-dbt==4.4.0",
  "dotenv==0.9.9",
  "tomlkit>=0.13.2",
]

[tool.uv]
default-groups = ["airflow", "dbt", 'dev', 'docs']
constraint-dependencies = [
  "aiohttp >= 3.14.3", # GHSA-cq5v-8q36-5273, and related aiohttp advisories
  "tornado >= 6.5.8", # tornado security advisories
  "cryptography >= 49.0.0", # cryptography security advisories
  "pymdown-extensions >= 11.0.0", # pymdown-extensions security advisories
  "apache-airflow-providers-google >= 22.3.0", # apache-airflow-providers-google security advisories
  "uv >= 0.13.4", # GHSA-hq85-5cpj-mr62, PYSEC-2026-4321
  "pyjwt >= 2.15.0", # CVE-2026-101917, CVE-2026-101918, CVE-2026-102265, CVE-2026-102266, CVE-2026-102267, CVE-2026-102268, CVE-2026-102269, CVE-2026-102270, CVE-2026-102271, CVE-2026-102272, CVE-2026-102273, CVE-2026-102274, CVE-2026-102275, CVE-2026-103001, GHSA-2gx3-rcp4-g85q, GHSA-42vr-xj54-vc7v, GHSA-8wjv-2p76-3863, GHSA-9j54-fg26-wv3r, GHSA-9v7f-9g4p-ffgj, GHSA-ffc3-869f-jxw9, GHSA-gvp8-978c-rx2q, GHSA-hxm8-2xgr-2p9m, GHSA-jwrc-g2q2-pq5p, GHSA-p4g4-x82p-q773, GHSA-pxh4-856f-4h89, GHSA-r6x4-923q-g947, GHSA-w2cx-738m-mc7w, GHSA-w6j9-cwv2-h6wq, GHSA-x33g-cr3x-6449, PYSEC-2026-4140, PYSEC-2026-4141, PYSEC-2026-4142, PYSEC-2026-4143, PYSEC-2026-4144, PYSEC-2026-4145, PYSEC-2026-4146, PYSEC-2026-4147, PYSEC-2026-4148, PYSEC-2026-4149, PYSEC-2026-4150, PYSEC-2026-4151, PYSEC-2026-4152, PYSEC-2026-4183
  "authlib >= 1.9.1", # CVE-2026-114614, CVE-2026-114615, CVE-2026-114616, CVE-2026-114617, CVE-2026-114618, CVE-2026-114619, CVE-2026-114620, CVE-2026-116672, CVE-2026-96760, GHSA-6v38-4h7w-rj9h, GHSA-7vr2-2fgp-9w7p, GHSA-8m4g-j4wp-wgcg, GHSA-c5mf-xmp2-59rc, GHSA-c73q-w75p-j82v, GHSA-fch4-3c6x-j4gc, GHSA-jj7h-c3hg-m23x, GHSA-q686-2qmg-hqc7, GHSA-x4rv-c3wx-4cr8, PYSEC-2026-4354, PYSEC-2026-4355, PYSEC-2026-4356, PYSEC-2026-4357, PYSEC-2026-4358, PYSEC-2026-4359, PYSEC-2026-4360
]

[tool.uv.workspace]
exclude = ["jobs"] # allow to init new uv projects in these folders without --no-workspace flag


## ruff
[tool.ruff]
target-version = 'py312'

lint.select = ["E4", "E7", "E9", "F", "I"]
# TARGET : lint.select = [
#     "E",      # pycodestyle
#     "W",      # pycodestyle
#     "F",      # Pyflakes
#     "B",      # flake8-bugbear
#     "C4",     # flake8-comprehensions
#     "I",      # isort
#     "SIM",    # flake8-simplify
#     "TCH",    # flake8-type-checking
#     "TID",    # flake8-tidy-imports
#     "UP",     # pyupgrade
#     "PT",     # flake8-pytest-style
#     "RUF",    # Ruff-specific rules
#     "FBT001", # flake8-boolean-trap
# ]

[tool.ruff.lint.pydocstyle]
# Automatically disable rules that are incompatible with Google docstring convention
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
# Pydantic needs to be able to evaluate types at runtime
# see https://pypi.org/project/flake8-type-checking/ for flake8-type-checking documentation
# see https://beta.ruff.rs/docs/settings/#flake8-type-checking-runtime-evaluated-base-classes for ruff documentation
